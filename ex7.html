<!DOCTYPE html>
<html>
<head>
<style>
  table {
    width: 100%;
    border-collapse: collapse; /* 1. 邊框合併為單線 */
  }

  table, th, td {
    border: 1px solid black;   /* 設定邊框 */
  }

  th, td {
    padding: 5px;             /* 2. 內距 5px */
    text-align: left;         /* 3. 文字靠左 */
  }
</style>
</head>
<body>

  <table>
    <tr>
      <th>Name</th>
      <th>Student ID</th>
    </tr>
    <tr>
      <td>何沛姍</td>
      <td>111401006</td>
    </tr>
  </table>

</body>
</html>
