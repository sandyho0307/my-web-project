<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dive into Dilemma - 深度漸變實作</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            /* 移除 background-attachment: fixed，讓背景隨內容延伸 */
            /* 根據企劃書：從淺藍(陽光層)過渡至全黑(深海層) */
            background: linear-gradient(to bottom, 
                #87CEEB 0%,    /* 海平面：淺藍 */
                #01579b 25%,   /* 深度 200m 附近：深藍 */
                #002147 50%,   /* 深度 500m 附近：暗藍 */
                #000000 100%   /* 深度 1000m：全黑 */
            );
            color: white;
            font-family: "Microsoft JhengHei", sans-serif;
        }

        /* 為了讓背景漸變拉開，我們需要足夠的頁面高度 */
        .scroll-wrapper {
            height: 5000px; 
            position: relative;
        }

        /* 固定在中央的下潛視窗 */
        .submersible-window {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75vw;
            height: 55vh;
            border: 12px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            box-shadow: 0 0 0 500px rgba(0, 0, 0, 0.3); /* 模擬窗外陰暗感 */
            pointer-events: none;
            z-index: 100;
        }

        .depth-info {
            position: fixed;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 101;
            text-align: right;
        }

        .section-text {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20%;
        }
    </style>
</head>
<body>

    <div class="submersible-window"></div>

    <div class="depth-info">
        <h2 id="meters" class="display-4 fw-bold">0</h2>
        <p class="mb-0">METERS</p>
        <small id="zone-name" class="text-info">陽光層 (Epipelagic)</small>
    </div>

    <div class="scroll-wrapper">
        <section class="section-text">
            <h1 class="display-2 fw-bold">Dive into Dilemma</h1>
            <p>準備進入一場關於海洋、權衡與抉擇的下潛之旅。</p>
        </section>

        <section class="section-text">
            <h2>深度 200m</h2>
            <p>陽光逐漸消失，這裡的生物必須做出抉擇才能生存。</p>
        </section>

        <section class="section-text" style="margin-top: 1000px;">
            <h2>深度 1000m</h2>
            <p>歡迎來到午夜層，這裡只有永恆的黑暗與未知的考驗。</p>
        </section>
    </div>

    <script>
        window.addEventListener('scroll', function() {
            let scrollY = window.scrollY;
            // 比例換算：讓 5000px 的高度對應到 1000 公尺深度
            let depth = Math.floor(scrollY / 5);
            document.getElementById('meters').innerText = depth;

            // 動態更新層級名稱
            let zone = document.getElementById('zone-name');
            if (depth < 200) {
                zone.innerText = "陽光層 (Epipelagic)";
                zone.style.color = "#87CEEB";
            } else if (depth < 500) {
                zone.innerText = "暮色層 (Mesopelagic)";
                zone.style.color = "#01579b";
            } else {
                zone.innerText = "午夜層 (Bathypelagic)";
                zone.style.color = "#555";
            }
        });
    </script>

</body>
</html>
