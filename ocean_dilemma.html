<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dive into Dilemma | SDG 14 海洋保育專案</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        :root {
            --sea-surface: #87CEEB;
            --sea-deep: #000080;
            --sea-abyss: #000000;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "Inter", "Microsoft JhengHei", sans-serif;
            background: linear-gradient(to bottom, 
                var(--sea-surface) 0%, 
                var(--sea-deep) 40%, 
                var(--sea-abyss) 100%);
            color: white;
            overflow-x: hidden;
            /* 總高度設定，讓漸變隨滾動展開 */
            height: 6000px; 
        }

        /* 第一人稱視角窗 (固定物件) */
        .submersible-window {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw; height: 60vh;
            border: 15px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.4);
            pointer-events: none;
            z-index: 1000;
        }

        /* 深度顯示器 */
        .depth-gauge {
            position: fixed;
            right: 40px; top: 50%;
            transform: translateY(-50%);
            text-align: right;
            z-index: 1001;
        }

        /* 內容區塊佈局 */
        .section-content {
            height: 1200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 15%;
        }

        /* 兩難抉擇彈窗樣式 */
        .dilemma-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            backdrop-filter: blur(8px);
        }
        .dilemma-card {
            background: #111;
            padding: 50px;
            border: 1px solid #00bcd4;
            border-radius: 20px;
            max-width: 600px;
        }

        /* 視覺濾鏡效果：當選擇「開發」時觸發 */
        .polluted-filter {
            filter: blur(4px) grayscale(50%);
            transition: filter 2s ease;
        }

        .ocean-item { width: 200px; position: absolute; }
    </style>
</head>
<body>

    <div class="submersible-window"></div>
    
    <div class="depth-gauge">
        <h1 id="meter-display" class="display-3 fw-bold">0</h1>
        <p class="h4">METERS</p>
        <span id="zone-label" class="badge bg-info">陽光層</span>
    </div>

    <div id="dilemma-modal" class="dilemma-overlay">
        <div class="dilemma-card">
            <h2 id="modal-title" class="text-info mb-4">抉擇時刻</h2>
            <p id="modal-text" class="lead mb-5"></p>
            <div class="d-grid gap-3 d-md-flex justify-content-md-center">
                <button class="btn btn-outline-info btn-lg px-4" onclick="handleChoice('A')">選項 A</button>
                <button class="btn btn-outline-light btn-lg px-4" onclick="handleChoice('B')">選項 B</button>
            </div>
        </div>
    </div>
