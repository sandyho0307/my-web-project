<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dive into Dilemma - 海洋兩難抉擇</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            /* 建立足夠長的頁面來模擬下潛深度 */
            height: 5000px; 
            /* 實作背景深度漸變：淺藍(0m) -> 深藍(500m) -> 黑色(1000m) */
            background: linear-gradient(to bottom, #4fc3f7 0%, #01579b 50%, #000000 100%);
            background-attachment: fixed;
            color: white;
            font-family: "Microsoft JhengHei", sans-serif;
            overflow-x: hidden;
        }

        /* 中央固定視窗 (下潛探測器視角) */
        .submersible-window {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 60vh;
            border: 15px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            box-shadow: 0 0 100px rgba(0, 0, 0, 0.5), inset 0 0 50px rgba(0, 0, 0, 0.8);
            pointer-events: none; /* 確保不影響滑鼠捲動 */
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 深度計數器 */
        .depth-counter {
            position: fixed;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2rem;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.6);
            z-index: 101;
            text-align: right;
        }

        /* 內容區塊樣式 */
        .content-section {
            height: 1000px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 100px;
            text-align: center;
            position: relative;
        }

        h1 { font-size: 4rem; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
        p { font-size: 1.5rem; max-width: 600px; }
    </style>
</head>
<body>

    <div class="submersible-window"></div>

    <div class="depth-counter">
        <div id="meters">0</div>
        <div style="font-size: 1rem;">METERS</div>
    </div>

    <section class="content-section">
        <h1 class="display-1 fw-bold">Dive into Dilemma</h1>
        <p class="lead">準備好深入海洋，面對那些沒有標準答案的抉擇了嗎？</p>
        <div class="mt-5">往下捲動開始下潛 ↓</div>
    </section>

    <section class="content-section">
        <h2>陽光層 (0m - 200m)</h2>
        <p>這裡是海洋最生機勃勃的地方，但也是人類活動最頻繁的區域。</p>
    </section>

    <script>
        // 更新深度計數器的簡單邏輯
        window.onscroll = function() {
            var scrollPos = window.scrollY;
            // 假設捲動 5 像素等於下潛 1 公尺
            var depth = Math.floor(scrollPos / 5);
            document.getElementById('meters').innerText = depth;
        };
    </script>

</body>
</html>
