<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dive into Dilemma - 深度漸變實作</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            /* 移除 background-attachment: fixed，讓背景隨內容延伸 */
            /* 根據企劃書：從淺藍(陽光層)過渡至全黑(深海層) */
            background: linear-gradient(to bottom, 
                #87CEEB 0%,    /* 海平面：淺藍 */
                #01579b 25%,   /* 深度 200m 附近：深藍 */
                #002147 50%,   /* 深度 500m 附近：暗藍 */
                #000000 100%   /* 深度 1000m：全黑 */
            );
            color: white;
            font-family: "Microsoft JhengHei", sans-serif;
        }

        /* 為了讓背景漸變拉開，我們需要足夠的頁面高度 */
        .scroll-wrapper {
            height: 5000px; 
            position: relative;
        }

        /* 固定在中央的下潛視窗 */
        .submersible-window {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 75vw;
            height: 55vh;
            border: 12px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            box-shadow: 0 0 0 500px rgba(0, 0, 0, 0.3); /* 模擬窗外陰暗感 */
            pointer-events: none;
            z-index: 100;
        }

        .depth-info {
            position: fixed;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 101;
            text-align: right;
        }

        .section-text {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20%;
        }
    </style>
</head>
<body>

    <div class="submersible-window"></div>

    <div class="depth-info">
        <h2 id="meters" class="display-4 fw-bold">0</h2>
        <p class="mb-0">METERS</p>
        <small id="zone-name" class="text-info">陽光層 (Epipelagic)</small>
    </div>

    <div class="scroll-wrapper">
        <section class="section-text">
            <h1 class="display-2 fw-bold">Dive into Dilemma</h1>
            <p>準備進入一場關於海洋、權衡與抉擇的下潛之旅。</p>
        </section>

        <section class="section-text">
            <h2>深度 200m</h2>
            <p>陽光逐漸消失，這裡的生物必須做出抉擇才能生存。</p>
        </section>

        <section class="section-text" style="margin-top: 1000px;">
            <h2>深度 1000m</h2>
            <p>歡迎來到午夜層，這裡只有永恆的黑暗與未知的考驗。</p>
        </section>
    </div>

    <script>
        window.addEventListener('scroll', function() {
            let scrollY = window.scrollY;
            // 比例換算：讓 5000px 的高度對應到 1000 公尺深度
            let depth = Math.floor(scrollY / 5);
            document.getElementById('meters').innerText = depth;

            // 動態更新層級名稱
            let zone = document.getElementById('zone-name');
            if (depth < 200) {
                zone.innerText = "陽光層 (Epipelagic)";
                zone.style.color = "#87CEEB";
            } else if (depth < 500) {
                zone.innerText = "暮色層 (Mesopelagic)";
                zone.style.color = "#01579b";
            } else {
                zone.innerText = "午夜層 (Bathypelagic)";
                zone.style.color = "#555";
            }
        });
    </script>
<style>
    /* 互動彈窗樣式 */
    .dilemma-overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.8);
        display: none; /* 預設隱藏 */
        justify-content: center;
        align-items: center;
        z-index: 2000;
        backdrop-filter: blur(5px);
    }
    .dilemma-card {
        background: #1a1a1a;
        padding: 40px;
        border-radius: 20px;
        border: 1px solid #00bcd4;
        text-align: center;
        max-width: 500px;
    }
    .btn-choice {
        margin: 10px;
        padding: 15px 30px;
        transition: 0.3s;
    }
    /* 當環境變差時的濾鏡類別 */
    .polluted {
        filter: blur(3px) grayscale(40%) sepia(20%);
        transition: 2s;
    }
</style>

<div id="dilemma-modal" class="dilemma-overlay">
    <div class="dilemma-card">
        <h3 class="text-info mb-4">抉擇時刻：離岸風電開發</h3>
        <p class="mb-4">為了達成減碳目標，政府計畫在此區興建風機。但這會干擾白海豚的迴聲定位，你支持開發嗎？</p>
        <button class="btn btn-outline-info btn-choice" onclick="makeChoice('green')">支持綠能開發</button>
        <button class="btn btn-outline-light btn-choice" onclick="makeChoice('nature')">優先保護棲地</button>
    </div>
</div>

<script>
    let hasTriggered = false; // 確保只觸發一次

    window.addEventListener('scroll', function() {
        let scrollY = window.scrollY;
        let depth = Math.floor(scrollY / 5);
        document.getElementById('meters').innerText = depth;

        // 當潛到 300 公尺時跳出視窗
        if (depth >= 300 && !hasTriggered) {
            triggerDilemma();
        }
    });

    function triggerDilemma() {
        hasTriggered = true;
        document.getElementById('dilemma-modal').style.display = 'flex';
        document.body.style.overflow = 'hidden'; // 鎖定滾動
    }

    function makeChoice(choice) {
        document.getElementById('dilemma-modal').style.display = 'none';
        document.body.style.overflow = 'auto'; // 恢復滾動

        if (choice === 'green') {
            // 選擇開發：背景變混濁 (將濾鏡套用在滾動容器上)
            document.querySelector('.scroll-wrapper').classList.add('polluted');
            alert("你選擇了能源轉型，但附近的生物多樣性開始下降...");
        } else {
            alert("你守護了這片海洋的寧靜，但減碳進度陷入停滯。");
        }
    }
</script>
</body>
</html>
