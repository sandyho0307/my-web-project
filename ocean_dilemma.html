<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dive into Dilemma | 海洋性格實驗室</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        :root { --accent: #00bcd4; --bg-dark: #0a0a0a; }
        body { margin: 0; padding: 0; background: var(--bg-dark); color: white; font-family: "Inter", "Microsoft JhengHei", sans-serif; overflow-x: hidden; }

        /* [設計理念] 背景漸變與視窗 [cite: 11-18] */
        #ocean-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #87CEEB 0%, #01579b 30%, #002147 60%, #000 100%);
            background-size: 100% 6000px; z-index: -2; transition: filter 1.5s ease;
        }

        /* 沉浸式視窗 [cite: 13-15] */
        .submersible-window {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85vw; height: 65vh; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 40px; box-shadow: 0 0 0 1000px rgba(0,0,0,0.7);
            pointer-events: none; z-index: 1000;
        }

        /* 超開放實驗室風格對話框 [cite: 22-24] */
        .dilemma-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); display: none;
            justify-content: center; align-items: center; z-index: 3000;
            backdrop-filter: blur(20px);
        }
        .quiz-card {
            background: rgba(255, 255, 255, 0.05); padding: 50px; border-radius: 35px;
            border: 1px solid rgba(255, 255, 255, 0.2); text-align: center; max-width: 600px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .choice-btn {
            width: 100%; margin-top: 15px; padding: 18px; border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.3); background: transparent;
            color: white; transition: 0.3s; font-size: 1.1rem;
        }
        .choice-btn:hover { background: white; color: black; transform: translateY(-3px); }

        /* 性格卡片結算頁面 [cite: 25-26, 51] */
        #result-page {
            display: none; padding: 100px 20px; text-align: center; background: #111;
        }
        .result-card {
            background: linear-gradient(135deg, #1e3a8a, #1e40af); padding: 60px;
            border-radius: 40px; display: inline-block; max-width: 500px; width: 100%;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8); position: relative; overflow: hidden;
        }
        .badge-sdg { font-size: 0.8rem; background: rgba(255,255,255,0.2); padding: 5px 15px; border-radius: 20px; }
    </style>
</head>
<body>

    <div id="ocean-bg"></div>
    <div class="submersible-window"></div>

    <div class="fixed-top p-4 text-center" style="z-index: 1001;">
        <small class="tracking-widest opacity-50">DEPTH: <span id="meters">0</span>M</small>
    </div>

    <div id="quiz-modal" class="dilemma-overlay">
        <div class="quiz-card">
            <h6 id="quiz-step" class="text-info mb-2 small tracking-widest">STEP 01</h6>
            <h2 id="quiz-title" class="mb-4 fw-bold"></h2>
            <p id="quiz-text" class="lead mb-5 opacity-75"></p>
            <div id="choices-container"></div>
        </div>
    </div>

    <div id="scroll-content" class="scroll-wrapper">
        <section style="height: 1200px; display: flex; flex-direction: column; justify-content: center; align-items: center;">
            <h1 class="display-1 fw-bold" data-aos="fade-up">Dive into Dilemma</h1>
            <p class="lead opacity-50" data-aos="fade-up">潛入海洋，直面那些沒有標準答案的權衡。</p>
        </section>
        </div>

    <div id="result-page">
        <div class="result-card" data-aos="flip-up">
            <h5 class="text-uppercase tracking-widest opacity-75 mb-3">Your Identity</h5>
            <h1 id="personality-name" class="display-4 fw-bold mb-4">海洋守護者</h1>
            <p id="personality-desc" class="lead mb-5 opacity-90"></p>
            
            <div class="row g-2 mb-4">
                <div class="col-6"><div class="badge-sdg">👥 <span id="same-pct">0</span>% 的人與你相同</div></div>
                <div class="col-6"><div class="badge-sdg">🤝 最佳夥伴：<span id="best-match">分析師</span></div></div>
            </div>

            <div class="p-4 bg-white text-dark rounded-4 text-start">
                <h6 class="fw-bold mb-3">📍 Takeaway：你可以如何行動？</h6>
                <p id="takeaway-text" class="small mb-0"></p>
            </div>

            <div class="mt-5">
                <button class="btn btn-outline-light btn-sm rounded-pill px-4" onclick="location.reload()">重新探索</button>
                <button class="btn btn-light btn-sm rounded-pill px-4 ms-2">一鍵下載卡片</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 1200 });

        const quizData = {
            300: {
                step: "01 / 03", title: "離岸風電與生態之爭",
                text: "減碳(SDG 13)是當務之急，但風電施工會損害鯨豚棲地。你如何權衡？ [cite: 6, 7]",
                options: [
                    { txt: "支持能源轉型，承擔局部損害", score: -10 },
                    { txt: "暫緩施工，尋求更完善的保育方案", score: 10 }
                ]
            },
            700: {
                step: "02 / 03", title: "深海資源的誘惑",
                text: "電動車需要深海金屬，開採卻會毀滅古老海床生態。你會簽下許可證嗎？ [cite: 52-53]",
                options: [
                    { txt: "簽署：加速全球綠色交通革命", score: -10 },
                    { txt: "拒絕：保護尚未被探索的深海基因庫", score: 10 }
                ]
            }
        };

        let currentScore = 0;
        let triggeredDepths = [];

        window.addEventListener('scroll', () => {
            let depth = Math.floor(window.scrollY / 5);
            document.getElementById('meters').innerText = depth;
            
            // 觸發問答邏輯 [cite: 22-23]
            [300, 700].forEach(d => {
                if (depth >= d && !triggeredDepths.includes(d)) showQuiz(d);
            });

            // 觸發最終結算
            if (depth >= 1000 && triggeredDepths.length >= 2) showResults();
        });

        function showQuiz(d) {
            triggeredDepths.push(d);
            const data = quizData[d];
            document.getElementById('quiz-step').innerText = data.step;
            document.getElementById('quiz-title').innerText = data.title;
            document.getElementById('quiz-text').innerText = data.text;
            
            const container = document.getElementById('choices-container');
            container.innerHTML = '';
            data.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerText = opt.txt;
                btn.onclick = () => {
                    currentScore += opt.score;
                    document.getElementById('quiz-modal').style.display = 'none';
                    document.body.style.overflow = 'auto';
                    if (opt.score < 0) document.getElementById('ocean-bg').style.filter = "blur(10px) grayscale(50%)";
                };
                container.appendChild(btn);
            });

            document.getElementById('quiz-modal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function showResults() {
            document.getElementById('scroll-content').style.display = 'none';
            document.getElementById('result-page').style.display = 'block';
            
            let name, desc, same, match, takeaway;

            if (currentScore > 0) {
                name = "感性生態守護者";
                desc = "你堅信萬物皆有其價值，寧可慢下發展的腳步，也不願讓任何生命成為進步的祭品。";
                same = 28; match = "冷靜減碳家";
                takeaway = "實踐 SDG 12：在生活中優先選擇「海洋友善」認證的產品，拒絕非永續捕撈的海鮮，用消費力守護海洋。 [cite: 7, 55]";
            } else {
                name = "冷靜減碳家";
                desc = "你具備大局觀，明白永續發展需要艱難的抉擇，為了對抗氣候災難，你願意承擔必要的代價。";
                same = 42; match = "感性生態守護者";
                takeaway = "實踐 SDG 13：支持國家級的低碳轉型政策，並參與能源轉型與生態補償機制的公共討論。 [cite: 7, 57]";
            }

            document.getElementById('personality-name').innerText = name;
            document.getElementById('personality-desc').innerText = desc;
            document.getElementById('same-pct').innerText = same;
            document.getElementById('best-match').innerText = match;
            document.getElementById('takeaway-text').innerText = takeaway;
        }
    </script>
</body>
</html>
