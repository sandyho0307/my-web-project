<!DOCTYPE html>
<html>
<head>
<style>
  /* 畫布控制：限制內容的最大寬度，並置中 */
  .container {
    max-width: 600px; /* 限制寬度，解決「畫布太大」的問題 */
    margin: 0 auto;   /* 置中對齊 */
    padding-top: 20px;
  }

  /* 表格設定 */
  table {
    border-collapse: collapse;
    width: 300px;
  }
  th, td {
    border: 1px solid black;
    padding: 8px;
  }
  th {
    background-color: gray;
    color: white;
  }
  
  /* 表格資料行顏色 */
  tbody tr:nth-child(odd) { background-color: yellow; }
  tbody tr:nth-child(even) { background-color: white; }

  /* 右上角固定區塊設定 */
  .fixed-div {
    position: fixed;
    top: 20px;
    right: 20px;
    border: 2px solid green;
    padding: 15px;
    width: 150px;
  }
</style>
</head>
<body>

  <div class="container">
    <table>
      <thead>
        <tr>
          <th>Firstname</th>
          <th>Lastname</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>1</td>
        </tr>
        <tr>
          <td>2</td>
          <td>2</td>
        </tr>
        <tr>
          <td>3</td>
          <td>3</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="fixed-div">
    This div<br>
    element has<br>
    position: fixed;
  </div>

</body>
</html>
