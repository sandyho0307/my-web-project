<!DOCTYPE html>
<html>
<head>
<style>
  /* 1. Create a wrapper to control the width */
  .wrapper {
    position: relative; /* Essential: This makes the div 'fixed' relative to this box */
    max-width: 500px;   /* Shrink this number to make the whole layout narrower */
    margin: 50px auto;  /* Centers the whole layout */
  }

  /* Table styling */
  table {
    border-collapse: collapse;
    width: 300px;
  }
  th, td {
    border: 1px solid black;
    padding: 8px;
  }
  th {
    background-color: gray;
    color: white;
  }
  tbody tr:nth-child(odd) { background-color: yellow; }
  tbody tr:nth-child(even) { background-color: white; }

  /* 2. Position the div relative to the wrapper */
  .fixed-div {
    position: absolute; /* It acts like 'fixed' but pinned to the wrapper */
    top: 0;             /* Aligned to the top of the wrapper */
    right: 0;           /* Aligned to the right of the wrapper */
    border: 2px solid green;
    padding: 15px;
    width: 150px;
  }
</style>
</head>
<body>

  <div class="wrapper">
    
    <table>
      <thead>
        <tr>
          <th>Firstname</th>
          <th>Lastname</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>1</td><td>1</td></tr>
        <tr><td>2</td><td>2</td></tr>
        <tr><td>3</td><td>3</td></tr>
      </tbody>
    </table>

    <div class="fixed-div">
      This div<br>
      element has<br>
      position: fixed;
    </div>

  </div>

</body>
</html>
