<!DOCTYPE html>
<html>
<head>
<style>
  /* Table styling */
  table {
    border-collapse: collapse;
    width: 300px;
  }
  th, td {
    border: 1px solid black;
    padding: 8px;
  }
  
  /* Grey header styling */
  th {
    background-color: #555; 
    color: white;
  }
  
  /* Alternating row colors (Yellow for odd rows, White for even) */
  tbody tr:nth-child(odd) {
    background-color: yellow;
  }
  tbody tr:nth-child(even) {
    background-color: white;
  }

  /* Fixed Div styling */
  .fixed-div {
    position: fixed;     /* This keeps it stuck to the viewport */
    top: 20px;           /* Distance from the top */
    right: 20px;         /* Distance from the right */
    border: 2px solid green;
    padding: 15px;
    width: 150px;
  }
</style>
</head>
<body>

  <table>
    <thead>
      <tr>
        <th>Firstname</th>
        <th>Lastname</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>1</td>
        <td>1</td>
      </tr>
      <tr>
        <td>2</td>
        <td>2</td>
      </tr>
      <tr>
        <td>3</td>
        <td>3</td>
      </tr>
    </tbody>
  </table>

  <div class="fixed-div">
    This div<br>
    element has<br>
    position: fixed;
  </div>

</body>
</html>
