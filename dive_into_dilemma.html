<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dive into Dilemma | 海洋性格行動實驗室</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --accent: #00bcd4; --danger: #ff4757; }
        body { margin: 0; background: #000; color: white; font-family: "Microsoft JhengHei", sans-serif; overflow-x: hidden; }
        
        #start-mask {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1a3a5a 0%, #000 100%);
            z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer;
        }

        /* 漸層海洋背景：加入了過渡動畫，讓變色更絲滑 */
        #ocean-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #87CEEB 0%, #01579b 40%, #002147 70%, #000 100%);
            z-index: -2; transition: filter 2s ease;
        }

        /* 潛水艇觀景窗 UI */
        .submersible-window {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 88vw; height: 68vh; border: 4px solid rgba(255,255,255,0.1);
            border-radius: 60px; box-shadow: 0 0 0 2000px rgba(0,0,0,0.7);
            pointer-events: none; z-index: 1000;
        }

        /* 高級去背素材動態環境 */
        .ocean-asset { position: absolute; background-size: contain; background-repeat: no-repeat; pointer-events: none; transition: opacity 1.5s ease; z-index: 10; }
        .swimming-fast { animation: swim 8s infinite alternate ease-in-out; }
        .swimming-slow { animation: swim 14s infinite alternate ease-in-out; }
        @keyframes swim { from { transform: translate(0,0); } to { transform: translate(100px, 40px); } }

        .gauge { position: fixed; right: 40px; top: 50%; transform: translateY(-50%); font-size: 3.5rem; font-weight: bold; color: var(--accent); z-index: 1001; text-shadow: 0 0 15px rgba(0,188,212,0.5); }

        .modal-box {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 3000;
            backdrop-filter: blur(15px);
        }
        .card-inner { background: #111; padding: 45px; border: 2px solid var(--accent); border-radius: 40px; text-align: center; max-width: 600px; box-shadow: 0 0 30px rgba(0,188,212,0.2); }
        .btn-opt { width: 100%; margin-top: 15px; padding: 18px; border: 1px solid rgba(255,255,255,0.3); background: none; color: white; border-radius: 15px; transition: 0.3s; font-weight: bold; }
        .btn-opt:hover { background: white; color: black; transform: scale(1.02); }

        .content-section { height: 2000px; display: flex; align-items: center; justify-content: center; position: relative; }
        
        #final-result {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #050a12; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 5000; padding: 20px; overflow-y: auto;
        }
        /* 性格分析小卡：優化為極簡黑卡雜誌風格，利於截圖分享 */
        .result-card { background: linear-gradient(135deg, #090d16 0%, #111827 100%); padding: 40px; border-radius: 35px; max-width: 500px; width: 100%; border: 1px solid rgba(255,255,255,0.1); text-align: center; color: white; }
    </style>
</head>
<body>

    <div id="start-mask" onclick="beginExperience()">
        <h1 class="display-3 fw-bold mb-4">Dive into Dilemma</h1>
        <p class="h4 text-info mb-5">SDG 14 海洋性格行動實驗</p>
        <div class="btn btn-info btn-lg rounded-pill px-5 py-3 fw-bold">點擊啟動 (播放海洋音效)</div>
    </div>

    <audio id="bg-sound" loop preload="auto">
        <source src="https://www.soundjay.com/nature/ocean-wave-1.mp3" type="audio/mpeg">
    </audio>

    <div id="ocean-bg"></div>
    <div class="submersible-window"></div>
    <div class="gauge"><span id="m-count">0</span>M</div>

    <div id="modal" class="modal-box">
        <div class="card-inner">
            <h6 class="text-info tracking-widest mb-2" id="q-step">REALITY ANALYSIS</h6>
            <h2 id="q-title" class="fw-bold mb-4"></h2>
            <p id="q-text" class="lead opacity-75 mb-5"></p>
            <div id="btn-area"></div>
        </div>
    </div>

    <div id="scroll-area" style="height: 12000px; display: none;">
        <section class="content-section"><h1>潛入海洋...</h1></section>
        <section class="content-section"><h2>陽光層 (200m)</h2></section>
        <section class="content-section"><h2>暮色層 (500m)</h2></section>
        <section class="content-section"><h2>午夜層 (800m)</h2></section>
        <section class="content-section"><h2>抵達深海底端</h2></section>
    </div>

    <div id="final-result">
        <div class="result-card shadow-lg" id="capture-zone">
            <h5 class="opacity-50 tracking-widest mb-3 text-uppercase fs-6" style="letter-spacing: 4px;">Ocean Identity Lab</h5>
            <h1 id="res-name" class="display-5 fw-bold text-info mb-4"></h1>
            <p id="res-desc" class="lead fs-6 opacity-75 mb-4 text-start px-2" style="line-height: 1.8;"></p>
            
            <div class="row g-2 mb-4">
                <div class="col-6"><div style="background: rgba(255,255,255,0.05); padding: 12px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05);">👥 <span id="res-pct">0</span>% 同類人</div></div>
                <div class="col-6"><div style="background: rgba(255,255,255,0.05); padding: 12px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05);">🤝 夥伴：<span id="res-match"></span></div></div>
            </div>

            <div class="p-4 bg-light text-dark rounded-4 text-start mb-4 shadow-sm">
                <h6 class="fw-bold mb-2 text-dark">📍 Takeaway 行動指南</h6>
                <p id="res-sdg" class="small mb-0 text-secondary" style="line-height: 1.6;"></p>
            </div>
            
            <div class="d-grid gap-2">
                <button class="btn btn-info rounded-pill py-3 fw-bold text-white shadow" onclick="saveCard()">💾 儲存特質小卡 (分享到 IG)</button>
                <button class="btn btn-outline-secondary rounded-pill py-2 small opacity-75 border-0 text-white mt-1" onclick="window.location.reload();">重新開始探險</button>
            </div>
        </div>
    </div>

    <script>
        const sound = document.getElementById('bg-sound');
        const modal = document.getElementById('modal');
        const bg = document.getElementById('ocean-bg');
        const scrollArea = document.getElementById('scroll-area');

        let score = 0;
        let done = [];
        let pollutionLevel = 0; // 用來累積環境惡化程度

        function beginExperience() {
            document.getElementById('start-mask').style.display = 'none';
            scrollArea.style.display = 'block';
            document.body.style.overflow = 'auto';
            sound.play().catch(e => console.log("音訊啟動被限制"));
            initHighQualityEco();
        }

        // 優化方向：動態注入高解析度去背 Unsplash 圖像資產
        function initHighQualityEco() {
            const assets = [
                { url: 'https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=150&q=80', top: 1500, type: 'swimming-fast' }, // 海龜
                { url: 'https://images.unsplash.com/photo-1560275669-46c5a88d6a4c?auto=format&fit=crop&w=120&q=80', top: 3500, type: 'swimming-slow' }, // 水母
                { url: 'https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=100&q=80', top: 5200, type: 'swimming-fast' },
                { url: 'https://images.unsplash.com/photo-1618477388954-7852f32655ec?auto=format&fit=crop&w=120&q=80', top: 7800, type: 'swimming-slow' }  // 深海魚類
            ];

            assets.forEach((asset, i) => {
                let div = document.createElement('div');
                div.className = `ocean-asset ${asset.type} asset-id-${i}`;
                div.style.backgroundImage = `url('${asset.url}')`;
                div.style.width = '120px';
                div.style.height = '120px';
                div.style.left = `${Math.random() * 70 + 10}%`;
                div.style.top = `${asset.top}px`;
                div.style.borderRadius = '50%'; // 形成透亮圓形視窗感
                scrollArea.appendChild(div);
            });
        }

        const questions = [
            { d: 200, t: "離岸風電噪音", p: "風電能減碳，但施工噪音傷害鯨豚棲地。你支持立即開工嗎？", a: "支持發展", b: "保育優先" },
            { d: 400, t: "幽靈漁網代價", p: "清理棄網需耗大量高碳燃料。要出動清理船嗎？", a: "行動清理", b: "維持低碳" },
            { d: 600, t: "責任消費抉擇", p: "買昂貴的永續標章海鮮，還是便宜的來源不明海鮮？", a: "節省預算", b: "選購認證" },
            { d: 800, t: "深海採礦爭議", p: "電動車需要深海礦產，但採礦會毀滅海床。支持嗎？", a: "支持開採", b: "嚴格禁止" },
            { d: 950, t: "塑膠微粒災難", p: "全面禁塑會造成生活巨變。支持立即立法嗎？", a: "穩健轉型", b: "立即禁塑" }
        ];

        window.onscroll = () => {
            let scrollTotal = document.documentElement.scrollHeight - window.innerHeight;
            let currentScroll = window.scrollY;
            let pct = currentScroll / scrollTotal;
            let depth = Math.floor(pct * 1000);
            
            document.getElementById('m-count').innerText = depth;

            questions.forEach((q, idx) => {
                if (depth >= q.d && !done.includes(idx)) {
                    showQ(idx);
                }
            });

            if (depth >= 985 && done.length === 5) {
                showFinal();
            }
        };

        function showQ(idx) {
            done.push(idx);
            const q = questions[idx];
            document.getElementById('q-title').innerText = q.t;
            document.getElementById('q-text').innerText = q.p;
            const area = document.getElementById('btn-area');
            area.innerHTML = '';

            [q.a, q.b].forEach((txt, i) => {
                const b = document.createElement('button');
                b.className = 'btn-opt';
                b.innerText = txt;
                b.onclick = () => {
                    if (i === 0) {
                        score -= 10;
                        pollutionLevel += 25; // 優化：污染採取累積制
                        bg.style.filter = `hue-rotate(${pollutionLevel}deg) brightness(${100 - pollutionLevel/2}%) blur(${pollutionLevel/10}px)`;
                        // 部分生物因環境變差降低透明度
                        document.querySelectorAll('.ocean-asset').forEach(asset => {
                            asset.style.opacity = `${1 - pollutionLevel/120}`;
                        });
                    } else {
                        score += 10;
                    }
                    modal.style.display = 'none';
                    document.body.style.overflow = 'auto';
                };
                area.appendChild(b);
            });
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function showFinal() {
            document.getElementById('final-result').style.display = 'flex';
            document.body.style.overflow = 'hidden';
            window.scrollTo(0, 0);

            let name, desc, pct, match, sdg;
            if (score > 0) {
                name = "深海光之守護者"; 
                desc = "你對物種與棲地的生命尊重高於一切。在經濟與保育的巨大失衡前，你甘願選擇代價較高的守護之路，抗拒短期利益，將目光投向跨越世代的原始正義。"; 
                pct = 32; 
                match = "理性減碳決策家";
                sdg = "【實踐 SDG 14：永續海洋】在日常採購中，主動辨識具有 MSC 或 ASC 生態標章之海鮮，並支持關閉特定高危珊瑚礁觀光區，將消費行為轉換為具體的環境防禦力。";
            } else {
                name = "理性減碳決策家"; 
                desc = "你擁有宏觀的結構性大局觀。面對全球氣候災難，你深知不能因區域性的感性保育而延遲了淨零轉型步伐，傾向在眾多代價中選擇最能對抗總體氣候變遷的全局解方。"; 
                pct = 46; 
                match = "深海光之守護者";
                sdg = "【實踐 SDG 13：氣候行動】關注並推動具備高生態補償機制的能源轉型政策，理解並支持綠色金融，將精力集中在解決宏觀碳排放與產業再生結構重組。";
            }
            
            document.getElementById('res-name').innerText = name;
            document.getElementById('res-desc').innerText = desc;
            document.getElementById('res-pct').innerText = pct;
            document.getElementById('res-match').innerText = match;
            document.getElementById('res-sdg').innerText = sdg;
        }

        // 優化方向：卡片儲存分享功能 (透過 html2canvas 將黑卡雜誌排版轉化為圖片下載)
        function saveCard() {
            const zone = document.getElementById('capture-zone');
            // 暫時隱藏儲存按鈕以免被拍進去
            const buttons = zone.querySelector('.d-grid');
            buttons.style.opacity = '0';

            html2canvas(zone, {
                backgroundColor: '#090d16',
                scale: 2, // 提升圖片清晰度，適合視網膜螢幕
                logging: false,
                useCORS: true // 允許跨網域圖片資源截圖
            }).then(canvas => {
                buttons.style.opacity = '1'; // 恢復按鈕
                const link = document.createElement('a');
                link.download = `Dive_into_Dilemma_${document.getElementById('res-name').innerText}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(err => {
                buttons.style.opacity = '1';
                alert("儲存失敗，請嘗試使用手機自帶螢幕截圖功能。");
            });
        }
    </script>
</body>
</html>
