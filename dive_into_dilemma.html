<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Dive into Dilemma | 海洋性格行動實驗室</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --accent: #00bcd4; }
        body { margin: 0; background: #000; color: white; font-family: "Microsoft JhengHei", sans-serif; overflow-x: hidden; }

        /* 背景：實現真實下潛顏色變化 */
        #ocean-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #87CEEB 0%, #01579b 25%, #002147 50%, #000 85%);
            z-index: -2; transition: 1.5s ease;
        }

        /* 探測器視窗 */
        .submersible-window {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 88vw; height: 68vh; border: 4px solid rgba(255,255,255,0.1);
            border-radius: 60px; box-shadow: 0 0 0 2000px rgba(0,0,0,0.7);
            pointer-events: none; z-index: 1000;
        }

        /* 豐富生態 - 開心水族箱風格 */
        .ocean-life { position: absolute; font-size: 2.5rem; pointer-events: none; transition: 2s ease; z-index: 10; }
        .swimming { animation: swim 6s infinite alternate ease-in-out; }
        @keyframes swim { from { transform: translate(0,0); } to { transform: translate(60px, 30px); } }

        /* 深度計 */
        .depth-gauge { position: fixed; right: 50px; top: 50%; transform: translateY(-50%); z-index: 1001; text-align: right; }

        /* 互動彈窗 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 3000;
            backdrop-filter: blur(20px);
        }
        .quiz-card { background: #111; padding: 50px; border-radius: 40px; border: 2px solid var(--accent); text-align: center; max-width: 600px; }
        .choice-btn { width: 100%; margin-top: 15px; padding: 20px; border-radius: 15px; border: 1px solid #555; background: none; color: white; transition: 0.3s; }
        .choice-btn:hover { background: white; color: black; }

        /* 結算小卡 */
        #result-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 5000; display: none; flex-direction: column; justify-content: center; align-items: center; overflow-y: auto;
        }
        .personality-card { 
            background: linear-gradient(135deg, #0f172a, #1e3a8a); padding: 50px; 
            border-radius: 40px; max-width: 550px; width: 90%; border: 1px solid var(--accent); text-align: center;
        }

        .scroll-space { height: 12000px; position: relative; }
    </style>
</head>
<body>

    <audio id="bgm" loop preload="auto">
        <source src="https://www.soundjay.com/nature/ocean-wave-1.mp3" type="audio/mpeg">
    </audio>

    <div id="ocean-bg"></div>
    <div class="submersible-window"></div>

    <div class="depth-gauge">
        <h1 class="display-1 fw-bold mb-0 text-info"><span id="meters">0</span>M</h1>
        <p class="h4 opacity-50">DEPTH</p>
    </div>

    <div id="quiz-modal" class="modal-overlay">
        <div class="quiz-card">
            <h2 id="q-title" class="mb-4"></h2>
            <p id="q-text" class="lead mb-5 opacity-75"></p>
            <div id="choices-area"></div>
        </div>
    </div>

    <div class="scroll-space" id="main-content">
        <section style="height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">
            <h1 class="display-1 fw-bold">Dive into Dilemma</h1>
            <p class="h4 opacity-50">點擊畫面開啟聲音，往下捲動下潛</p>
        </section>
    </div>

    <div id="result-screen">
        <div class="personality-card">
            <h5 class="opacity-50 tracking-widest mb-3">OCEAN IDENTITY</h5>
            <h1 id="res-name" class="display-4 fw-bold text-info mb-4">分析中...</h1>
            <p id="res-desc" class="lead mb-4"></p>
            
            <div class="row g-2 mb-4">
                <div class="col-6"><div style="background: rgba(255,255,255,0.1); padding: 10px; border-radius: 15px;">👥 <span id="res-pct">0</span>% 同類人</div></div>
                <div class="col-6"><div style="background: rgba(255,255,255,0.1); padding: 10px; border-radius: 15px;">🤝 夥伴：<span id="res-match"></span></div></div>
            </div>

            <div class="p-4 bg-white text-dark rounded-4 text-start mb-4">
                <h6 class="fw-bold mb-2">📍 SDG 行動指南 (Takeaway)</h6>
                <p id="res-sdg" class="small mb-0"></p>
            </div>
            
            <button class="btn btn-info w-100 rounded-pill py-3 fw-bold" onclick="window.location.reload()">重新開始下潛</button>
        </div>
    </div>

    <script>
        const bgm = document.getElementById('bgm');
        const main = document.getElementById('main-content');
        
        // 點擊即播放
        document.body.onclick = () => { bgm.play(); };

        // 1. 生成 100 隻魚 (豐富畫面)
        function initEco() {
            const icons = ['🐟', '🐠', '🐡', '🐙', '🐢', '🦐', '🐬', '🐳', '🦈', '🦀', '🌿'];
            for(let i=0; i<100; i++) {
                const el = document.createElement('div');
                el.className = 'ocean-life swimming';
                el.innerText = icons[Math.floor(Math.random() * icons.length)];
                el.style.top = (Math.random() * 10000 + 1000) + 'px';
                el.style.left = Math.random() * 85 + 5 + '%';
                el.style.opacity = Math.random() * 0.7 + 0.3;
                main.appendChild(el);
            }
        }
        initEco();

        // 2. 五道題目
        const quizData = [
            { d: 300, t: "離岸風電噪音", p: "風電能減碳(SDG 13)，但施工噪音會傷白海豚聽覺。支持立即施工嗎？", a: "支持：能源轉型優先", b: "反對：生物保育優先" },
            { d: 1500, t: "幽靈漁網代價", p: "清理棄網需耗高碳燃料。要出動清理船嗎？", a: "行動：立即清理廢棄物", b: "維持：優先將預算投入減碳" },
            { d: 3500, t: "責任消費抉擇", p: "買昂貴的永續標章海鮮，還是便宜的來源不明海鮮？", a: "現實：考慮家庭支出節省", b: "永續：堅持選購認證產品" },
            { d: 5500, t: "深海採礦爭議", p: "電動車需要深海礦產，但採礦會毀滅海床生態。支持開採嗎？", a: "支持：加速電動化革命", b: "反對：保護未知的深海" },
            { d: 7500, t: "塑膠微粒災難", text: "全面禁塑會造成生活巨變。你支持立即立法嗎？", a: "穩健：慢慢轉型求穩定", b: "立即：推動全民減塑生活" }
        ];

        let score = 0, triggered = [];

        window.onscroll = () => {
            let scrollY = window.scrollY;
            let depth = Math.floor(scrollY / 10);
            document.getElementById('meters').innerText = depth;

            // 背景移動
            document.getElementById('ocean-bg').style.backgroundPosition = `0 -${scrollY}px`;

            // 觸發問題
            quizData.forEach((q, idx) => {
                if (depth >= q.d && !triggered.includes(idx)) {
                    showQuiz(idx);
                }
            });

            // 結算：當滑過 9000px 且 5 題答完
            if (scrollY >= 9000 && triggered.length === 5) {
                showFinal();
            }
        };

        function showQuiz(idx) {
            triggered.push(idx);
            const q = quizData[idx];
            document.getElementById('q-title').innerText = q.t;
            document.getElementById('q-text').innerText = q.p;
            
            const area = document.getElementById('choices-area');
            area.innerHTML = '';
            [q.a, q.b].forEach((txt, i) => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerText = txt;
                btn.onclick = () => {
                    if (i === 0) { 
                        score -= 10;
                        document.getElementById('ocean-bg').style.filter = "hue-rotate(90deg) brightness(40%) blur(10px)";
                        document.querySelectorAll('.ocean-life').forEach(f => f.style.opacity = '0');
                    } else { 
                        score += 10; 
                        document.getElementById('ocean-bg').style.filter = "none";
                        document.querySelectorAll('.ocean-life').forEach(f => f.style.opacity = '0.7');
                    }
                    document.getElementById('quiz-modal').style.display = 'none';
                    document.body.style.overflow = 'auto';
                    if (triggered.length === 5) setTimeout(showFinal, 1500);
                };
                area.appendChild(btn);
            });
            document.getElementById('quiz-modal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function showFinal() {
            document.getElementById('result-screen').style.display = 'flex';
            document.body.style.overflow = 'hidden';
            window.scrollTo(0, 0);

            let n, d, p, m, s;
            if (score > 0) {
                n = "感性生態守護者"; d = "你深信生命的絕對價值高於商業利益。在權衡中，你寧願慢下腳步，也決不讓任何生命成為進步的祭品。"; p = 31; m = "冷靜減碳家"; s = "SDG 14 行動：選擇 MSC 認證永續海鮮，並在生活中主動減塑。";
            } else {
                n = "冷靜減碳家"; d = "你具備大局觀，明白對抗氣候災難需要艱難的權衡。你願意在理性分析後承擔代價。"; p = 44; m = "感性生態守護者"; s = "SDG 13 行動：支持能源轉型政策，並參與低碳生活的推廣與實踐。";
            }
            document.getElementById('res-name').innerText = n;
            document.getElementById('res-desc').innerText = d;
            document.getElementById('res-pct').innerText = p;
            document.getElementById('res-match').innerText = m;
            document.getElementById('res-sdg').innerText = s;
        }
    </script>
</body>
</html>
