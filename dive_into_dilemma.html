<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dive into Dilemma | SDG 海洋行動實驗室</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        :root { --accent: #00bcd4; --danger: #ff5252; }
        body { margin: 0; padding: 0; background: #000; color: white; font-family: "Inter", "Microsoft JhengHei", sans-serif; overflow-x: hidden; }

        /* [設計理念] 背景隨捲動深度漸變 [cite: 14, 27-36] */
        #ocean-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #87CEEB 0%, #01579b 20%, #002147 50%, #000 80%);
            background-size: 100% 15000px; z-index: -2; transition: all 1.5s ease;
        }

        /* [特殊功能] 污染懸浮物與震動 */
        #particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(circle, #4b3a2b 2px, transparent 2px);
            background-size: 50px 50px; opacity: 0; pointer-events: none; z-index: -1;
            transition: opacity 2s ease;
        }
        .active-pollution { opacity: 0.8 !important; animation: drift 15s linear infinite; }
        @keyframes drift { from { background-position: 0 0; } to { background-position: 500px 1000px; } }

        /* [佈局設計] 固定探測器視窗 [cite: 13-15] */
        .submersible-window {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85vw; height: 65vh; border: 2px solid rgba(255,255,255,0.1);
            border-radius: 50px; box-shadow: 0 0 0 2000px rgba(0,0,0,0.7);
            pointer-events: none; z-index: 1000;
        }

        /* 音訊控制 */
        #audio-btn {
            position: fixed; left: 30px; bottom: 30px; z-index: 2001;
            background: rgba(255,255,255,0.1); border: 1px solid white;
            color: white; padding: 10px 20px; border-radius: 50px; cursor: pointer;
            backdrop-filter: blur(5px);
        }

        /* [互動設計] OoopenLab 風格問答卡 [cite: 22-24] */
        .dilemma-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); display: none;
            justify-content: center; align-items: center; z-index: 3000;
            backdrop-filter: blur(25px);
        }
        .quiz-card {
            background: rgba(20, 20, 20, 0.95); padding: 50px; border-radius: 40px;
            border: 1px solid var(--accent); text-align: center; max-width: 650px;
        }
        .choice-btn {
            width: 100%; margin-top: 15px; padding: 18px; border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.3); background: transparent; color: white;
            transition: 0.3s ease; font-weight: 500;
        }
        .choice-btn:hover { background: white; color: black; transform: scale(1.02); }

        /* 生態多樣性動畫 (魚群、海龜) [cite: 19-21] */
        .ocean-life { position: absolute; transition: all 2s ease; z-index: 10; pointer-events: none; }
        .fish-group img { width: 60px; margin: 10px; animation: swim 3s infinite alternate; }
        @keyframes swim { from { transform: translate(0,0); } to { transform: translate(30px, 15px); } }

        .scroll-wrapper { position: relative; width: 100%; height: 15000px; z-index: 5; }
        .depth-gauge { position: fixed; right: 40px; top: 50%; transform: translateY(-50%); z-index: 1001; text-align: right; }

        /* 結算頁面設計 [cite: 51-57] */
        #result-page { display: none; background: #000; min-height: 100vh; position: relative; z-index: 4000; padding: 50px; }
        .result-card { background: linear-gradient(135deg, #1e3a8a, #1e40af); padding: 50px; border-radius: 40px; max-width: 600px; margin: auto; }
    </style>
</head>
<body>

    <audio id="bgm" loop>
        <source src="https://www.soundjay.com/nature/ocean-wave-1.mp3" type="audio/mpeg">
    </audio>

    <div id="ocean-bg"></div>
    <div id="particles"></div>
    <div class="submersible-window"></div>
    
    <button id="audio-btn" onclick="toggleAudio()">🔊 SOUND: OFF</button>

    <div class="depth-gauge">
        <h1 class="display-2 fw-bold mb-0"><span id="meters">0</span>M</h1>
        <p class="h4 opacity-50" id="zone-label">SUNLIGHT ZONE</p>
    </div>

    <div id="quiz-modal" class="dilemma-overlay">
        <div class="quiz-card">
            <h6 id="quiz-step" class="text-info mb-2 small tracking-widest">REALITY ANALYSIS</h6>
            <h2 id="quiz-title" class="mb-4 fw-bold"></h2>
            <p id="quiz-text" class="lead mb-5 opacity-75"></p>
            <div id="choices-container"></div>
        </div>
    </div>

    <div class="scroll-wrapper" id="main-content">
        <section style="height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">
            <h1 class="display-1 fw-bold mb-4" data-aos="fade-up">Dive into Dilemma</h1>
            <p class="lead" data-aos="fade-up" data-aos-delay="200">潛入深海，面對現實。你的抉擇，將改變這片海的色彩。</p>
        </section>

        <div id="eco-system" class="ocean-life fish-group" style="top: 1500px; left: 10%;">
            <img src="https://img.icons8.com/color/96/fish.png">
            <img src="https://img.icons8.com/color/96/clown-fish.png">
            <img src="https://img.icons8.com/color/96/angelfish.png">
            <img src="https://img.icons8.com/color/96/sea-turtle.png" style="width: 150px;">
        </div>

        <div id="trash-system" class="ocean-life" style="top: 4500px; right: 10%; opacity: 0;">
            <img src="https://img.icons8.com/color/160/trash.png" style="width: 250px;">
        </div>
    </div>

    <div id="result-page">
        <div class="result-card text-center" data-aos="zoom-in">
            <h5 class="opacity-50 mb-3">OCEAN GUARDIAN PROFILE</h5>
            <h1 id="personality-name" class="display-4 fw-bold mb-4">分析中...</h1>
            <p id="personality-desc" class="lead mb-5"></p>
            <div class="row g-3 mb-5 px-4">
                <div class="col-6 bg-white bg-opacity-10 py-3 rounded-4">👥 <span id="same-pct">0</span>% 同類人</div>
                <div class="col-6 bg-white bg-opacity-10 py-3 rounded-4">🤝 夥伴：<span id="best-match"></span></div>
            </div>
            <div class="p-4 bg-white text-dark rounded-4 text-start">
                <h6 class="fw-bold mb-2">📍 Takeaway 行動指南 (SDG Action)</h6>
                <p id="takeaway-text" class="small mb-0"></p>
            </div>
            <button class="btn btn-outline-light mt-5 rounded-pill px-5 py-3" onclick="location.reload()">重新探索海洋</button>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 1200 });
        
        // [內容來源] 真實現況題目設計 [cite: 6, 7, 52-53, 55]
        const quizData = {
            400: { 
                step: "01/05", title: "現況：能源轉型之難 (SDG 13)", 
                text: "台灣離岸風電正處於關鍵期。風場能提供大量綠能，但噪音會震碎珍稀鯨豚的聽覺。你支持立即施工嗎？",
                c1: "支持：忍受局部代價以達成減碳目標", c2: "反對：優先守護生物多樣性與棲地" 
            },
            1200: { 
                step: "02/05", title: "現況：幽靈漁網 (SDG 14)", 
                text: "全球每年遺落 64 萬噸漁網。清理需消耗大量高碳排燃料且預算極高。如何處理？",
                c1: "立即行動：不計成本清除海洋殺手", c2: "維持低碳：優先將預算用於減緩氣候變遷" 
            },
            2200: { 
                step: "03/05", title: "現況：責任消費 (SDG 12)", 
                text: "超市裡有兩份海鮮：一份是有永續標章但昂貴的，另一份是便宜但來源不明。你的選擇？",
                c1: "行動改變：堅持購買永續認證產品", c2: "現實考量：優先選擇價格低廉的產品" 
            },
            3500: { 
                step: "04/05", title: "現況：深海採礦", 
                text: "電動車需要深海稀有金屬。採礦能加速交通減碳，但會摧毀未知的深海生態。支持嗎？",
                c1: "支持採礦：為了全球電動化發展", c2: "嚴格禁止：保護人類最後的淨土" 
            },
            4800: { 
                step: "05/05", title: "現況：塑膠微粒災難", 
                text: "塑膠微粒已進入人體血液。全面禁塑會造成生活巨變，不禁止則後果不堪設想。你推動禁令嗎？",
                c1: "立即行動：推動強硬禁令與減塑生活", c2: "穩健轉型：先維持經濟穩定與生活便利" 
            }
        };

        let score = 0;
        let triggered = [];
        const bgm = document.getElementById('bgm');

        function toggleAudio() {
            if (bgm.paused) { bgm.play(); document.getElementById('audio-btn').innerText = "🔊 SOUND: ON"; }
            else { bgm.pause(); document.getElementById('audio-btn').innerText = "🔇 SOUND: OFF"; }
        }

        window.addEventListener('scroll', () => {
            let scrollY = window.scrollY;
            let depth = Math.floor(scrollY / 10);
            document.getElementById('meters').innerText = depth;
            document.getElementById('ocean-bg').style.backgroundPosition = `0 -${scrollY}px`;

            // 更新深度區間 [cite: 27-36]
            const label = document.getElementById('zone-label');
            if (depth < 200) label.innerText = "SUNLIGHT ZONE";
            else if (depth < 800) label.innerText = "TWILIGHT ZONE";
            else label.innerText = "MIDNIGHT ZONE";

            [400, 1200, 2200, 3500, 4800].forEach(d => {
                if (depth >= d && !triggered.includes(d)) showQuiz(d);
            });

            if (depth >= 6000 && triggered.length >= 5) showResults();
        });

        function showQuiz(d) {
            triggered.push(d);
            const data = quizData[d];
            document.getElementById('quiz-step').innerText = `STEP ${data.step}`;
            document.getElementById('quiz-title').innerText = data.title;
            document.getElementById('quiz-text').innerText = data.text;
            
            const container = document.getElementById('choices-container');
            container.innerHTML = '';
            [data.c1, data.c2].forEach((txt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerText = txt;
                btn.onclick = () => {
                    // [視覺連動] 行動與代價的視覺化 
                    if (idx === 0) { // 選擇 A (可能是開發/行動)
                        score -= 5;
                        document.getElementById('ocean-bg').style.filter = "hue-rotate(80deg) brightness(50%) blur(12px)";
                        document.getElementById('particles').classList.add('active-pollution');
                        document.getElementById('eco-system').style.opacity = "0";
                        document.getElementById('trash-system').style.opacity = "1";
                    } else { score += 5; }
                    document.getElementById('quiz-modal').style.display = 'none';
                    document.body.style.overflow = 'auto';
                };
                container.appendChild(btn);
            });
            document.getElementById('quiz-modal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function showResults() {
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('result-page').style.display = 'block';
            window.scrollTo(0, 0);

            let n, d, p, m, t;
            if (score > 0) {
                n = "感性生態守護者"; d = "你深信生命的絕對價值高於商業利益。在權衡中，你選擇守護海洋最純粹的平靜。"; p = 31; m = "冷靜減碳家";
                t = "你可以透過 SDG 12 行動：選擇 MSC 認證海鮮，並在日常生活中減少一次性塑膠的使用。 [cite: 55]";
            } else {
                n = "冷靜減碳家"; d = "你擁有強大的理性思維。你明白對抗氣候災難(SDG 13)需要必要的代價與權衡。"; p = 44; m = "感性生態守護者";
                t = "你可以透過 SDG 13 行動：參與低碳生活推廣，並支持具備生態補償機制的能源轉型政策。 [cite: 55]";
            }
            document.getElementById('personality-name').innerText = n;
            document.getElementById('personality-desc').innerText = d;
            document.getElementById('same-pct').innerText = p;
            document.getElementById('best-match').innerText = m;
            document.getElementById('takeaway-text').innerText = t;
        }
    </script>
</body>
</html>
