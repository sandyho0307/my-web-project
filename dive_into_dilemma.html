<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dive into Dilemma | 海洋性格行動實驗室</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --accent: #00bcd4; --danger: #ff4d4d; }
        body { margin: 0; padding: 0; background: #000; color: white; font-family: "Inter", "Microsoft JhengHei", sans-serif; overflow: hidden; }

        /* 啟動覆蓋層：確保聲音播放與互動開始 */
        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1a3a5a 0%, #000 100%); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }

        /* 深度漸變背景層 */
        #ocean-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #87CEEB 0%, #01579b 20%, #002147 50%, #000 80%);
            background-size: 100% 18000px; z-index: -2; transition: all 1.5s ease;
        }

        /* 懸浮污染微粒 */
        #particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(circle, #4b3a2b 2px, transparent 2px);
            background-size: 45px 45px; opacity: 0; pointer-events: none; z-index: -1;
            transition: opacity 2s ease;
        }
        .active-pollution { opacity: 0.8 !important; animation: drift 12s linear infinite; }
        @keyframes drift { from { background-position: 0 0; } to { background-position: 500px 1000px; } }

        /* 探測器視窗 */
        .submersible-window {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90vw; height: 70vh; border: 4px solid rgba(255,255,255,0.1);
            border-radius: 60px; box-shadow: 0 0 0 3000px rgba(0,0,0,0.7);
            pointer-events: none; z-index: 1000;
        }

        /* 豐富生態物件 - 開心水族箱風格 */
        .ocean-life { position: absolute; font-size: 2.5rem; pointer-events: none; transition: all 2s ease; z-index: 10; }
        .swimming { animation: swim 6s infinite alternate ease-in-out; }
        @keyframes swim { from { transform: translate(0,0); } to { transform: translate(60px, 30px); } }

        /* 問答卡片 UI */
        .dilemma-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); display: none;
            justify-content: center; align-items: center; z-index: 3000;
            backdrop-filter: blur(25px);
        }
        .quiz-card {
            background: rgba(15, 20, 30, 0.95); padding: 50px; border-radius: 40px;
            border: 2px solid var(--accent); text-align: center; max-width: 650px;
        }
        .choice-btn {
            width: 100%; margin-top: 15px; padding: 20px; border-radius: 18px;
            border: 1px solid rgba(255,255,255,0.2); background: transparent; color: white;
            transition: 0.3s; font-weight: bold;
        }
        .choice-btn:hover { background: white; color: black; transform: scale(1.02); }

        .scroll-space { width: 100%; height: 18000px; position: relative; }
        .depth-gauge { position: fixed; right: 50px; top: 50%; transform: translateY(-50%); z-index: 1001; text-align: right; }

        /* 結算頁面 */
        #result-screen { display: none; background: #000; min-height: 100vh; position: fixed; top:0; left:0; width:100%; z-index: 9999; padding: 50px; overflow-y: auto; }
        .result-card { background: linear-gradient(135deg, #0f172a, #1e3a8a); padding: 50px; border-radius: 40px; max-width: 600px; margin: auto; border: 1px solid var(--accent); box-shadow: 0 0 50px rgba(0,188,212,0.3); }
    </style>
</head>
<body>

    <div id="start-overlay" onclick="beginAdventure()">
        <h1 class="display-2 fw-bold mb-4 text-info">Dive into Dilemma</h1>
        <p class="lead mb-5 opacity-75">SDG 14 海洋性格行動實驗室</p>
        <button class="btn btn-outline-info btn-lg rounded-pill px-5 py-3">點擊啟動探險 (開啟音樂)</button>
    </div>

    <audio id="ocean-bgm" loop>
        <source src="https://www.soundjay.com/nature/ocean-wave-1.mp3" type="audio/mpeg">
    </audio>

    <div id="ocean-bg"></div>
    <div id="particles"></div>
    <div class="submersible-window"></div>

    <div class="depth-gauge">
        <h1 class="display-1 fw-bold mb-0 text-info"><span id="meters">0</span>M</h1>
        <p class="h4 opacity-50" id="zone-label">SUNLIGHT ZONE</p>
    </div>

    <div id="quiz-modal" class="dilemma-overlay">
        <div class="quiz-card">
            <h6 id="quiz-step" class="text-info mb-2 small tracking-widest">ACTUAL SITUATION</h6>
            <h2 id="quiz-title" class="mb-4 fw-bold"></h2>
            <p id="quiz-text" class="lead mb-5 opacity-75"></p>
            <div id="choices-container"></div>
        </div>
    </div>

    <div class="scroll-space" id="main-content">
        <section style="height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;">
            <h1 class="display-2 fw-bold mb-4">Dive into Dilemma</h1>
            <p class="lead">往下捲動潛入深海</p>
            <div class="mt-5 opacity-25">向下捲動 ↓</div>
        </section>
        </div>

    <div id="result-screen">
        <div class="result-card text-center">
            <h5 class="opacity-50 mb-3 tracking-widest">FINAL PROFILE</h5>
            <h1 id="personality-name" class="display-4 fw-bold mb-4 text-info"></h1>
            <p id="personality-desc" class="lead mb-5 px-3"></p>
            <div class="row g-3 mb-5 px-3">
                <div class="col-6 bg-white bg-opacity-10 py-3 rounded-4">👥 <span id="same-pct"></span>% 同類人</div>
                <div class="col-6 bg-white bg-opacity-10 py-3 rounded-4">🤝 最佳夥伴：<span id="best-match"></span></div>
            </div>
            <div class="p-4 bg-white text-dark rounded-4 text-start mx-2">
                <h6 class="fw-bold mb-2">📍 Takeaway 行動指南 (SD
