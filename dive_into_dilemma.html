<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dive into Dilemma | 海洋性格行動實驗室</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --accent: #00bcd4; --danger: #ff4757; }
        body { margin: 0; background: #000; color: white; font-family: "Microsoft JhengHei", sans-serif; overflow-x: hidden; transition: transform 0.1s ease; }
        
        /* 啟動遮罩 */
        #start-mask {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1a3a5a 0%, #000 100%);
            z-index: 10000; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer;
        }

        #ocean-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #87CEEB 0%, #01579b 40%, #002147 70%, #000 100%);
            z-index: -2; transition: filter 2s ease;
        }

        /* 潛水艇視窗 */
        .submersible-window {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 88vw; height: 68vh; border: 4px solid rgba(255,255,255,0.1);
            border-radius: 60px; box-shadow: 0 0 0 2000px rgba(0,0,0,0.7);
            pointer-events: none; z-index: 1000; transition: border-color 0.5s ease;
        }

        /* 開心水族箱魚群 */
        .fish { position: absolute; font-size: 2.5rem; transition: transform 2s ease, opacity 1.5s ease; z-index: 10; pointer-events: none; }
        .swimming { animation: swim 8s infinite alternate ease-in-out; }
        @keyframes swim { 
            0% { transform: translate(0,0) scaleX(1); } 
            50% { transform: translate(80px, 20px) scaleX(1); }
            51% { transform: translate(80px, 20px) scaleX(-1); }
            100% { transform: translate(0,0) scaleX(-1); }
        }

        /* 潛水艇受損震動 */
        @keyframes submarine-shake {
            0%, 100% { transform: translate(0, 0); }
            20%, 60% { transform: translate(-8px, 5px); }
            40%, 80% { transform: translate(8px, -5px); }
        }
        .shake-active { animation: submarine-shake 0.4s ease-in-out 2; }

        .gauge { position: fixed; right: 40px; top: 50%; transform: translateY(-50%); font-size: 3.5rem; font-weight: bold; color: var(--accent); z-index: 1001; text-shadow: 0 0 15px rgba(0,188,212,0.5); text-align: right; }
        .zone-indicator { font-size: 1rem; color: rgba(255,255,255,0.4); letter-spacing: 2px; margin-top: 5px; }

        .modal-box {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); display: none; justify-content: center; align-items: center; z-index: 3000;
            backdrop-filter: blur(20px);
        }
        .card-inner { background: #0d1117; padding: 45px; border: 2px solid var(--accent); border-radius: 40px; text-align: center; max-width: 600px; box-shadow: 0 0 30px rgba(0,188,212,0.15); transition: border-color 1s ease; }
        .btn-opt { width: 100%; margin-top: 15px; padding: 18px; border: 1px solid rgba(255,255,255,0.15); background: none; color: white; border-radius: 15px; transition: 0.3s; font-weight: bold; }
        .btn-opt:hover { background: white; color: black; transform: translateY(-2px); }

        .content-section { height: 2400px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .content-section h2 { font-size: 3.5rem; font-weight: 800; letter-spacing: 4px; background: linear-gradient(180deg, #fff, rgba(255,255,255,0.3)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        #final-result {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #040710; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 5000; padding: 20px; overflow-y: auto;
        }
        .result-card { background: linear-gradient(135deg, #070a12 0%, #0f172a 100%); padding: 45px; border-radius: 35px; max-width: 520px; width: 100%; border: 1px solid rgba(0, 188, 212, 0.3); text-align: center; color: white; }
    </style>
</head>
<body>

    <div id="start-mask" onclick="beginExperience()">
        <h1 class="display-3 fw-bold mb-4">Dive into Dilemma</h1>
        <p class="h4 text-info mb-5">SDG 14 海洋性格行動實驗室</p>
        <div class="btn btn-info btn-lg rounded-pill px-5 py-3 fw-bold shadow-lg text-white">啟動實驗船</div>
    </div>

    <div id="ocean-bg"></div>
    <div class="submersible-window" id="sub-frame"></div>
    
    <div class="gauge">
        <div><span id="m-count">0</span>M</div>
        <div class="zone-indicator" id="zone-txt">SUNLIGHT ZONE</div>
    </div>

    <div id="modal" class="modal-box">
        <div class="card-inner" id="quiz-node">
            <h6 class="text-info tracking-widest mb-2" id="q-step">REALITY ANALYSIS</h6>
            <h2 id="q-title" class="fw-bold mb-4"></h2>
            <p id="q-text" class="lead opacity-75 mb-5" style="font-size: 1.1rem; line-height: 1.7;"></p>
            <div id="btn-area"></div>
        </div>
    </div>

    <div id="scroll-area" style="position: relative; width: 100%;">
        <section class="content-section"><h2>下潛準備...</h2><p class="opacity-50">請滾動滑鼠，垂直潛入海溝</p></section>
        <section class="content-section" id="sec-1"><h2>陽光層 (200m)</h2><p class="opacity-50">光線充足的近海生態核心區</p></section>
        <section class="content-section" id="sec-2"><h2>暮色層 (500m)</h2><p class="opacity-50">光線微弱的未知中層地帶</p></section>
        <section class="content-section" id="sec-3"><h2>午夜層 (800m)</h2><p class="opacity-50">完全黑暗的巨大封存壓力區</p></section>
        <section class="content-section" id="sec-4"><h2>超深淵層 (950m)</h2><p class="opacity-50">抵達沉積浩劫的最終審判底端</p></section>
    </div>

    <div id="final-result">
        <div class="result-card shadow-lg" id="capture-zone">
            <h5 class="text-info tracking-widest mb-3 text-uppercase small" style="letter-spacing: 4px;">SDG 14 Profile Certificate</h5>
            <h1 id="res-name" class="display-6 fw-bold mb-4 text-white"></h1>
            <p id="res-desc" class="small opacity-75 mb-4 text-start px-2" style="line-height: 1.7; text-align: justify;"></p>
            
            <div class="row g-2 mb-4">
                <div class="col-6"><div style="background: rgba(0,188,212,0.08); padding: 12px; border-radius: 15px; border: 1px solid rgba(0,188,212,0.15);">👥 <span id="res-pct" class="fw-bold text-info">0</span>% 同類人</div></div>
                <div class="col-6"><div style="background: rgba(255,255,255,0.05); padding: 12px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.08);">🤝 夥伴：<span id="res-match" class="fw-bold"></span></div></div>
            </div>

            <div class="p-4 bg-light text-dark rounded-4 text-start mb-4 shadow-sm" style="border-left: 4px solid var(--accent);">
                <h6 class="fw-bold mb-2 text-dark">📍 Takeaway 行動指南</h6>
                <p id="res-sdg" class="small mb-0 text-secondary" style="line-height: 1.6;"></p>
            </div>
            
            <div class="d-grid gap-2">
                <button class="btn btn-info rounded-pill py-3 fw-bold text-white shadow" onclick="saveCard()">💾 儲存性格小卡 (分享至社群)</button>
                <button class="btn btn-outline-secondary rounded-pill py-2 small opacity-50 border-0 text-white mt-1" onclick="window.location.reload();">重新實驗</button>
            </div>
        </div>
    </div>

    <script>
        const modal = document.getElementById('modal');
        const bg = document.getElementById('ocean-bg');
        const frame = document.getElementById('sub-frame');
        const scrollArea = document.getElementById('scroll-area');

        let audioCtx, whiteNoise, filterNode;
        let score = 0;
        let done = [];
        let damageCount = 0; 

        // 預先在全域宣告生物層分布範圍
        const creaturesData = [
            { zone: 'light', icons: ['🐬', '🐠', '🐳', '🐢', '🐟', '🌿'], minTop: 1400, maxTop: 3900 },
            { zone: 'twilight', icons: ['🐙', '🦑', '🐡', '🦐', '🐠', '🐚'], minTop: 4100, maxTop: 8600 },
            { zone: 'midnight', icons: ['🦈', '🐡', '🌿', '🐚', '🐙', '🐟'], minTop: 8800, maxTop: 11600 }
        ];

        // 每個生態層生成 60 隻，全網頁共高達 180 隻動態生物
        function initBiomedicalLayers() {
            creaturesData.forEach(layer => {
                for(let i=0; i<60; i++) {
                    let f = document.createElement('div');
                    f.className = 'fish swimming';
                    f.innerText = layer.icons[Math.floor(Math.random() * layer.icons.length)];
                    f.style.left = Math.random() * 85 + 5 + '%';
                    f.style.top = (Math.random() * (layer.maxTop - layer.minTop) + layer.minTop) + 'px';
                    f.style.opacity = Math.random() * 0.4 + 0.3;
                    f.setAttribute('data-zone', layer.zone);
                    scrollArea.appendChild(f);
                }
            });
        }
        initBiomedicalLayers(); // 確保 DOM 建立時魚群立即充斥水族箱

        // 體驗開始
        function beginExperience() {
            document.getElementById('start-mask').style.display = 'none';
            document.body.style.overflow = 'auto';

            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let bufferSize = 2 * audioCtx.sampleRate;
                let noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                let output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }

                whiteNoise = audioCtx.createBufferSource();
                whiteNoise.buffer = noiseBuffer;
                whiteNoise.loop = true;

                filterNode = audioCtx.createBiquadFilter();
                filterNode.type = 'lowpass';
                filterNode.frequency.setValueAtTime(400, audioCtx.currentTime); 

                let gainNode = audioCtx.createGain();
                gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);
                
                setInterval(() => {
                    let now = audioCtx.currentTime;
                    gainNode.gain.linearRampToValueAtTime(0.18, now + 2);
                    gainNode.gain.linearRampToValueAtTime(0.08, now + 4);
                }, 4000);

                whiteNoise.connect(filterNode);
                filterNode.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                whiteNoise.start(0);
            } catch(e) { console.log(e); }
        }

        const questions = [
            { d: 200, t: "離岸風電與近海棲地 (200M)", p: "此區為陽光層，風電能大幅度減碳(SDG 13)，但風機打樁的巨大噪音會震碎白海豚與近海鯨類的聽覺。你的決策？", a: "支持轉型：忍受局部代價推動綠能發展", b: "保育優先：暫緩風場工期守護近海物種" },
            { d: 450, t: "中層漁業開發兩難 (450M)", p: "潛入暮色層。人類因淺海漁業枯竭，正密謀大肆捕撈此區龐大的中層魚類資源（如燈籠魚）加工為經濟飼料，但這會切斷深海食物鏈。要簽發捕撈許可嗎？", a: "開放捕撈：舒緩陸地糧食與商業飼料危機", b: "嚴格禁捕：全面保護深海食物鏈的基石" },
            { d: 650, t: "綠色晶片與深海採礦 (650M)", p: "抵達海底山脈。電動車電池急需此處儲量豐富的稀有重金屬礦產，但採礦會永久摧毀海底萬年珊瑚礁。是否開採？", a: "同意開採：加速全球低碳載具革命", b: "反對採礦：拒絕讓深海地貌成為轉型祭品" },
            { d: 800, t: "幽靈漁網與碳封存浩劫 (800M)", p: "進入完全黑暗的午夜層。沈底廢棄漁網正持續纏殺深海物種，破壞海洋雪的碳封存機制。派遣打撈船清理需要燃燒巨量高碳排燃料。是否出動？", a: "觀望大局：優先維護大氣低碳排大局", b: "立刻打撈：不計燃料成本打撈致命幽靈網" },
            { d: 950, t: "終端微粒沈積浩劫 (950M)", p: "抵達海溝底端。地表排出的塑膠微粒最終全部沈降堆積於此，生態瀕臨窒息。若要全面禁塑將對零售供應鏈造成巨幅經濟衝擊。你支持立即立法禁塑嗎？", a: "穩健轉型：採取漸進式減塑避免經濟震盪", b: "強硬禁塑：寧可承受生活與商業重創也必須即刻禁絕" }
        ];

        window.onscroll = () => {
            let scrollTotal = document.documentElement.scrollHeight - window.innerHeight;
            let currentScroll = window.scrollY;
            let pct = currentScroll / scrollTotal;
            let depth = Math.floor(pct * 1000);
            
            document.getElementById('m-count').innerText = depth;

            if (filterNode && audioCtx) {
                let targetFreq = 400 - (depth * 0.33);
                filterNode.frequency.setValueAtTime(Math.max(75, targetFreq), audioCtx.currentTime);
            }

            const zoneTxt = document.getElementById('zone-txt');
            if (depth < 200) zoneTxt.innerText = "SUNLIGHT ZONE";
            else if (depth < 700) zoneTxt.innerText = "TWILIGHT ZONE";
            else zoneTxt.innerText = "MIDNIGHT ZONE";

            questions.forEach((q, idx) => {
                if (depth >= q.d && !done.includes(idx)) {
                    showQ(idx);
                }
            });

            if (depth >= 985 && done.length === 5) {
                showFinal();
            }
        };

        function showQ(idx) {
            done.push(idx);
            const q = questions[idx];
            
            let finalPrompt = q.p;
            if (idx >= 3 && damageCount >= 2) {
                finalPrompt = `⚠️【連鎖後果：由於你先前的決策忽視環境，此深海系統已嚴重受損。】 ${q.p}`;
                document.getElementById('quiz-node').style.borderColor = "var(--danger)";
            }

            document.getElementById('q-title').innerText = q.t;
            document.getElementById('q-text').innerText = finalPrompt;
            const area = document.getElementById('btn-area');
            area.innerHTML = '';

            [q.a, q.b].forEach((txt, i) => {
                const b = document.createElement('button');
                b.className = 'btn-opt';
                b.innerText = txt;
                b.onclick = () => {
                    if (i === 0) {
                        score -= 10;
                        damageCount++;
                        
                        // 環境混濁累積視覺化
                        let rotateDeg = damageCount * 45;
                        let brightnessVal = 50 - (damageCount * 8);
                        let blurPx = damageCount * 3;
                        bg.style.filter = `hue-rotate(${rotateDeg}deg) brightness(${brightnessVal}%) blur(${blurPx}px)`;
                        
                        // 受損震盪效果
                        document.body.classList.add('shake-active');
                        setTimeout(() => document.body.classList.remove('shake-active'), 400);

                        // 生物受驚嚇依照破壞比例死亡/淡出
                        let allFish = document.querySelectorAll('.fish');
                        let killTarget = Math.floor(allFish.length * (damageCount / 5));
                        allFish.forEach((f, fIdx) => {
                            if (fIdx < killTarget) {
                                f.style.transform = `translate(${Math.random()*200 - 100}px, -200px) scale(0)`;
                                f.style.opacity = '0';
                            }
                        });
                    } else {
                        score += 10;
                    }
                    modal.style.display = 'none';
                    document.body.style.overflow = 'auto';
                };
                area.appendChild(b);
            });
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function showFinal() {
            document.getElementById('final-result').style.display = 'flex';
            document.body.style.overflow = 'hidden';
            window.scrollTo(0, 0);

            let name, desc, pct, match, sdg;
            
            if (score >= 20) {
                name = "深海光之守護者";
                desc = "你堅信生命的絕對價值高於商業進步。在重大的利益權衡前，你甘願放慢轉型效率，也決不讓任何一個物種在你的決策下遭到滅絕。";
                pct = 24; match = "理性減碳策劃家";
                sdg = "【永續海洋行動】在日常消費中，主動購買具備 MSC 或 ASC 認證的友善海鮮；減少一次性餐具使用，從消費端直接轉化為抵禦深海污染的防禦力。";
            } else if (score >= 0 && score < 20) {
                name = "永續消費實踐者";
                desc = "你屬於務實的草根行動派。你重視環境價值，並傾向透過日常生活中的綠色消費與公民自律來達成永續，抗拒過於激進或由上而下的法規強制作風。";
                pct = 31; match = "綠色經濟領航員";
                sdg = "【責任生產與消費】落實循環經濟，支持參與在地二手社群、淨灘行動，用具體的日常實踐來引導零售產業進行結構性的永續轉型。";
            } else if (score >= -20 && score < 0) {
                name = "理性減碳策劃家";
                desc = "你具備宏觀的大局觀與商管邏輯。你明白對抗全球氣候浩劫(SDG 13)需要必要的權衡。在區域生態與全球淨零大局產生衝突時，你傾向選擇宏觀碳排效益最高的解方。";
                pct = 28; match = "深海光之守護者";
                sdg = "【結構性低碳行動】關注並推動具備「生態補償機制」的乾淨能源政策，支持綠色金融，從制度與巨觀環境上引導能源結構的低碳轉型。";
            } else {
                name = "綠色經濟領航員";
                desc = "你是一位果斷的技術與轉型先鋒。你深信唯有加速推動工業科技革命、全面電動化與能源結構重組，才能徹底解決氣候災難。你願意承擔轉型初期的局部生態代價。";
                pct = 17; match = "永續消費實踐者";
                sdg = "【產業創新與轉型】參與並關注企業永續報告書(ESG)，監督跨國供應鏈的綠色採購方針，推動產業綠色技術與低碳製程的根本變革。";
            }
            
            document.getElementById('res-name').innerText = name;
            document.getElementById('res-desc').innerText = desc;
            document.getElementById('res-pct').innerText = pct;
            document.getElementById('res-match').innerText = match;
            document.getElementById('res-sdg').innerText = sdg;
        }

        // html2canvas 導出圖片函數
        function saveCard() {
            const zone = document.getElementById('capture-zone');
            const actionButtons = zone.querySelector('.d-grid');
            
            // 截圖前暫時隱藏下方的功能按鈕
            actionButtons.style.opacity = '0';

            html2canvas(zone, {
                backgroundColor: '#070a12',
                scale: 2, // 雙倍高解析度渲染
                useCORS: true
            }).then(canvas => {
                actionButtons.style.opacity = '1'; // 恢復按鈕可見度
                const link = document.createElement('a');
                link.download = `Dive_into_Dilemma_${document.getElementById('res-name').innerText}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(err => {
                actionButtons.style.opacity = '1';
                alert("儲存圖檔失敗，請直接使用手動螢幕截圖！");
            });
        }
    </script>
</body>
</html>
