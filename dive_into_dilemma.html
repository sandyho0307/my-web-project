<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Dive into Dilemma | 海洋行動實驗室</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { margin: 0; background: #000; color: white; font-family: "Microsoft JhengHei", sans-serif; }
        
        /* 背景：固定不動，隨分數變色 */
        #ocean-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #87CEEB 0%, #01579b 50%, #000 100%);
            z-index: -1; transition: 1s;
        }

        /* 撐開網頁高度，確保能滑到底 */
        .content-section { height: 1500px; display: flex; align-items: center; justify-content: center; }

        /* 固定深度計 */
        .gauge { position: fixed; right: 30px; top: 50%; transform: translateY(-50%); font-size: 3rem; font-weight: bold; color: #00bcd4; z-index: 100; }

        /* 問答視窗 */
        .modal-box {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .card-inner { background: #111; padding: 40px; border: 2px solid #00bcd4; border-radius: 30px; text-align: center; max-width: 500px; }
        .btn-opt { width: 100%; margin-top: 10px; padding: 15px; border: 1px solid #fff; background: none; color: white; border-radius: 10px; }
        .btn-opt:hover { background: white; color: black; }

        /* 魚群 */
        .fish { position: fixed; font-size: 3rem; transition: 1s; z-index: 10; pointer-events: none; }

        /* 結算頁面 */
        #final-result {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #001; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 2000;
        }
    </style>
</head>
<body>

    <audio id="bg-sound" loop src="https://www.soundjay.com/nature/ocean-wave-1.mp3"></audio>

    <div id="ocean-bg"></div>
    <div class="gauge"><span id="m-count">0</span>M</div>

    <div id="modal" class="modal-box">
        <div class="card-inner">
            <h2 id="q-title"></h2>
            <p id="q-text"></p>
            <div id="btn-area"></div>
        </div>
    </div>

    <div id="scroll-area">
        <section class="content-section"><h1>Dive into Dilemma<br><small>點擊畫面開啟聲音並下潛</small></h1></section>
        <section class="content-section"><h2>陽光層 (200m)</h2></section>
        <section class="content-section"><h2>暮色層 (500m)</h2></section>
        <section class="content-section"><h2>午夜層 (800m)</h2></section>
        <section class="content-section"><h2>抵達深海底端</h2></section>
    </div>

    <div id="final-result">
        <h1 style="color: #00bcd4;">你的海洋性格</h1>
        <h2 id="res-name" style="margin: 20px 0;">分析中...</h2>
        <p id="res-desc" style="max-width: 500px; text-align: center;"></p>
        <div style="background: white; color: black; padding: 20px; border-radius: 15px; margin-top: 20px;">
            <strong>SDG 行動指南：</strong>
            <p id="res-sdg" style="margin: 0;"></p>
        </div>
        <button onclick="location.reload()" style="margin-top: 30px; padding: 10px 30px;">重新開始</button>
    </div>

    <script>
        const sound = document.getElementById('bg-sound');
        const modal = document.getElementById('modal');
        const bg = document.getElementById('ocean-bg');

        // 點擊即啟動聲音
        document.body.onclick = () => sound.play();

        // 隨機生成 30 隻魚
        for(let i=0; i<30; i++) {
            let f = document.createElement('div');
            f.className = 'fish';
            f.innerText = '🐟';
            f.style.left = Math.random() * 90 + '%';
            f.style.top = Math.random() * 90 + '%';
            f.style.opacity = '0.4';
            document.body.appendChild(f);
        }

        const questions = [
            { d: 200, t: "離岸風電噪音", p: "風電減碳但傷鯨豚，支持立即施工嗎？", a: "支持發展", b: "保育優先" },
            { d: 400, t: "幽靈漁網", p: "清理廢棄物需耗費高碳排燃料。要做嗎？", a: "立即清理", b: "維持低碳" },
            { d: 600, t: "責任消費", p: "買便宜海鮮還是昂貴的永續海鮮？", a: "買便宜的", b: "買永續標章" },
            { d: 800, t: "深海採礦", p: "電動車需要深海礦產，但會破壞海床。支持嗎？", a: "支持採礦", b: "反對採礦" },
            { d: 950, t: "禁塑政策", p: "禁塑令會讓生活不便，你支持立法嗎？", a: "慢慢轉型", b: "立即禁塑" }
        ];

        let score = 0;
        let done = [];

        window.onscroll = () => {
            // 用捲動百分比換算深度，最高 1000m
            let scrollTotal = document.documentElement.scrollHeight - window.innerHeight;
            let currentScroll = window.scrollY;
            let pct = currentScroll / scrollTotal;
            let depth = Math.floor(pct * 1000);
            
            document.getElementById('m-count').innerText = depth;

            // 觸發問答
            questions.forEach((q, idx) => {
                if (depth >= q.d && !done.includes(idx)) {
                    showQ(idx);
                }
            });

            // 到達最後 980m 且答題完畢
            if (depth >= 980 && done.length === 5) {
                showFinal();
            }
        };

        function showQ(idx) {
            done.push(idx);
            const q = questions[idx];
            document.getElementById('q-title').innerText = q.t;
            document.getElementById('q-text').innerText = q.p;
            const area = document.getElementById('btn-area');
            area.innerHTML = '';

            [q.a, q.b].forEach((txt, i) => {
                const b = document.createElement('button');
                b.className = 'btn-opt';
                b.innerText = txt;
                b.onclick = () => {
                    if (i === 0) {
                        score -= 10;
                        bg.style.filter = "hue-rotate(90deg) brightness(50%)";
                        document.querySelectorAll('.fish').forEach(f => f.style.opacity = '0');
                    } else {
                        score += 10;
                        bg.style.filter = "none";
                        document.querySelectorAll('.fish').forEach(f => f.style.opacity = '0.4');
                    }
                    modal.style.display = 'none';
                    document.body.style.overflow = 'auto';
                };
                area.appendChild(b);
            });
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function showFinal() {
            document.getElementById('final-result').style.display = 'flex';
            let name = score > 0 ? "感性生態守護者" : "冷靜減碳家";
            let desc = score > 0 ? "你堅信生命的價值高於商業利益，守護海洋的原始與平靜。" : "你擁有強大的理性思維，明白對抗氣候災難需要艱難的權衡。";
            let sdg = score > 0 ? "SDG 14：選擇 MSC 永續標章海鮮，減少塑膠使用。" : "SDG 13：支持能源轉型政策，推動產業結構化減碳。";
            
            document.getElementById('res-name').innerText = name;
            document.getElementById('res-desc').innerText = desc;
            document.getElementById('res-sdg').innerText = sdg;
        }
    </script>
</body>
</html>
