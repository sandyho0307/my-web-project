<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dive into Dilemma | 海洋性格實驗室</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        :root { --accent: #00bcd4; }
        body { margin: 0; padding: 0; background: #000; color: white; font-family: "Inter", "Microsoft JhengHei", sans-serif; overflow-x: hidden; }

        /* [設計理念] 深度漸層背景：確保隨捲動產生明顯顏色變化 */
        #ocean-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #87CEEB 0%, #01579b 15%, #002147 40%, #000 70%);
            background-size: 100% 12000px; /* 拉長背景，確保下潛有感 */
            z-index: -2; transition: filter 2s ease;
        }

        /* [特殊功能] 污染效果 */
        #pollution-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(circle, #4b3a2b 2px, transparent 2px);
            background-size: 60px 60px; opacity: 0; pointer-events: none; z-index: -1;
            transition: opacity 2s ease;
        }
        .active-pollution { opacity: 0.7 !important; animation: drift 15s linear infinite; }
        @keyframes drift { from { background-position: 0 0; } to { background-position: 500px 1000px; } }

        /* [佈局設計] 固定視窗 */
        .submersible-window {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85vw; height: 65vh; border: 15px solid rgba(255,255,255,0.05);
            border-radius: 50px; box-shadow: 0 0 0 2000px rgba(0,0,0,0.65);
            pointer-events: none; z-index: 1000;
        }

        /* 靜音按鈕 UI */
        #audio-toggle {
            position: fixed; left: 30px; bottom: 30px; z-index: 2000;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3);
            color: white; padding: 10px 15px; border-radius: 50px; cursor: pointer;
            backdrop-filter: blur(5px); transition: 0.3s;
        }
        #audio-toggle:hover { background: rgba(255,255,255,0.3); }

        /* [視覺效果] 生態物件（開心水族箱風格） */
        .ocean-life { position: absolute; transition: all 2s ease; z-index: 10; }
        .fish-school img { width: 60px; margin: 5px; animation: swim 3s infinite alternate; }
        .seaweed { width: 100px; height: auto; opacity: 0.6; }
        @keyframes swim { from { transform: translate(0,0); } to { transform: translate(30px, 15px); } }

        /* 內容層級 */
        .scroll-wrapper { position: relative; width: 100%; height: 10000px; z-index: 5; }
        .depth-info { position: fixed; right: 40px; top: 50%; transform: translateY(-50%); z-index: 1001; text-align: right; }

        /* [互動設計] 問答彈窗 */
        .dilemma-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); display: none;
            justify-content: center; align-items: center; z-index: 3000;
            backdrop-filter: blur(20px);
        }
        .quiz-card {
            background: rgba(15, 15, 15, 0.95); padding: 50px; border-radius: 40px;
            border: 1px solid var(--accent); text-align: center; max-width: 650px;
        }
        .choice-btn {
            width: 100%; margin-top: 15px; padding: 18px; border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.2); background: transparent; color: white;
        }
        .choice-btn:hover { background: white; color: black; }
    </style>
</head>
<body>

    <audio id="bgm" loop>
        <source src="https://www.soundjay.com/nature/ocean-wave-1.mp3" type="audio/mpeg">
    </audio>

    <div id="ocean-bg"></div>
    <div id="pollution-overlay"></div>
    <div class="submersible-window"></div>

    <button id="audio-toggle" onclick="toggleAudio()">🔊 SOUND ON</button>

    <div class="depth-info">
        <h1 class="display-2 fw-bold mb-0"><span id="meters">0</span>M</h1>
        <p class="h4" id="zone-label" class="text-info">SUNLIGHT ZONE</p>
    </div>

    <div id="quiz-modal" class="dilemma-overlay">
        <div class="quiz-card">
            <h6 id="quiz-step" class="text-info mb-2 small">SDG 兩難實驗</h6>
            <h2 id="quiz-title" class="mb-4 fw-bold"></h2>
            <p id="quiz-text" class="lead mb-5 opacity-75"></p>
            <div id="choices-container"></div>
        </div>
    </div>

    <div class="scroll-wrapper">
        <section style="height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">
            <h1 class="display-1 fw-bold" data-aos="fade-up">Dive into Dilemma</h1>
            <p class="lead" data-aos="fade-up" data-aos-delay="200">點擊下方按鈕開啟聲音，往下捲動開始下潛</p>
        </section>

        <div id="eco-system-sunlight">
            <div class="ocean-life fish-school" style="top: 1200px; left: 10%;">
                <img src="https://img.icons8.com/color/96/fish.png"><img src="https://img.icons8.com/color/96/clown-fish.png">
                <br><img src="https://img.icons8.com/color/96/angelfish.png"><img src="https://img.icons8.com/color/96/fish.png">
            </div>
            <div class="ocean-life" style="top: 1500px; right: 20%;"><img src="https://img.icons8.com/color/160/sea-turtle.png" style="width: 180px;"></div>
            <div class="ocean-life" style="top: 1800px; left: 5%;"><img src="https://img.icons8.com/color/160/seaweed.png" class="seaweed"></div>
        </div>

        <div id="eco-system-midnight">
            <div class="ocean-life" style="top: 4500px; left: 15%;"><img src="https://img.icons8.com/color/160/jellyfish.png" style="width: 130px;"></div>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 1200 });
        
        const quizData = {
            300: { title: "離岸風電與生態之爭", text: "興建風場可提供大量綠能(SDG 13)，但施工噪音會讓白海豚迷航死亡。你的決策？", c1: "支持轉型：忍受局部代價", c2: "保育優先：守護生物棲地" },
            800: { title: "幽靈漁網的遺落", text: "海中發現大量廢棄漁網(SDG 14)。清理需耗費燃料產生碳排，且預算極高。如何處理？", c1: "立即清理：保護海洋生命", c2: "維持低碳：優先減緩氣候變遷" }
        };

        let triggeredDepths = [];
        const bgm = document.getElementById('bgm');
        const audioBtn = document.getElementById('audio-toggle');

        // 聲音控制邏輯
        function toggleAudio() {
            if (bgm.paused) {
                bgm.play();
                audioBtn.innerText = "🔊 SOUND ON";
            } else {
                bgm.pause();
                audioBtn.innerText = "🔇 SOUND OFF";
            }
        }

        window.addEventListener('scroll', () => {
            let scrollY = window.scrollY;
            let depth = Math.floor(scrollY / 10); // 調整下潛比例
            document.getElementById('meters').innerText = depth;

            // [視覺引導] 背景位置隨捲動同步改變顏色
            document.getElementById('ocean-bg').style.backgroundPosition = `0 -${scrollY}px`;

            const label = document.getElementById('zone-label');
            if (depth < 200) label.innerText = "SUNLIGHT ZONE";
            else if (depth < 700) {
                label.innerText = "TWILIGHT ZONE";
                label.style.color = "#00bcd4";
            } else {
                label.innerText = "MIDNIGHT ZONE";
                label.style.color = "#555";
            }

            [300, 800].forEach(d => {
                if (depth >= d && !triggeredDepths.includes(d)) showQuiz(d);
            });
        });

        function showQuiz(d) {
            triggeredDepths.push(d);
            const data = quizData[d];
            document.getElementById('quiz-title').innerText = data.title;
            document.getElementById('quiz-text').innerText = data.text;
            
            const container = document.getElementById('choices-container');
            container.innerHTML = '';
            [data.c1, data.c2].forEach((txt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerText = txt;
                btn.onclick = () => {
                    if (idx === 0) {
                        // [視覺連動] 選擇破壞後效果：變色、混濁、生物消失
                        document.getElementById('ocean-bg').style.filter = "hue-rotate(90deg) brightness(50%) blur(10px)";
                        document.getElementById('pollution-overlay').classList.add('active-pollution');
                        document.getElementById('eco-system-sunlight').style.opacity = "0";
                        document.getElementById('eco-system-sunlight').style.transform = "translateY(-100px)";
                    }
                    document.getElementById('quiz-modal').style.display = 'none';
                    document.body.style.overflow = 'auto';
                };
                container.appendChild(btn);
            });
            document.getElementById('quiz-modal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }
    </script>
</body>
</html>
