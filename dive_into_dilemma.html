<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dive into Dilemma | 海洋性格實驗室</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        :root { --accent: #00bcd4; }
        body { margin: 0; padding: 0; background: #000; color: white; font-family: "Inter", "Microsoft JhengHei", sans-serif; overflow-x: hidden; }

        /* 動態背景與漸層：隨捲動位置改變顏色 */
        #ocean-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, #87CEEB 0%, #01579b 25%, #002147 50%, #000 80%);
            background-size: 100% 12000px; z-index: -2; transition: all 1s ease;
        }

        #particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(circle, #4b3a2b 3px, transparent 3px);
            background-size: 50px 50px; opacity: 0; pointer-events: none; z-index: -1;
            transition: opacity 2s ease;
        }
        .active-pollution { opacity: 0.8 !important; animation: drift 10s linear infinite; }

        .shake-effect { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } }

        .submersible-window {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85vw; height: 65vh; border: 2px solid rgba(255,255,255,0.1);
            border-radius: 50px; box-shadow: 0 0 0 2000px rgba(0,0,0,0.7);
            pointer-events: none; z-index: 1000;
        }

        .dilemma-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); display: none;
            justify-content: center; align-items: center; z-index: 3000;
            backdrop-filter: blur(25px);
        }
        .quiz-card {
            background: rgba(20, 20, 20, 0.95); padding: 50px; border-radius: 40px;
            border: 2px solid var(--accent); text-align: center; max-width: 650px;
        }
        .choice-btn {
            width: 100%; margin-top: 15px; padding: 20px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2); background: transparent;
            color: white; transition: 0.3s ease; font-weight: 500;
        }
        .choice-btn:hover { background: white; color: black; }

        /* 魚群動畫 - 強化版水族箱 */
        .ocean-life { position: absolute; font-size: 2.5rem; pointer-events: none; transition: opacity 1s ease; z-index: 10; }
        .swimming { animation: swim 5s infinite alternate ease-in-out; }
        @keyframes swim { from { transform: translate(0,0); } to { transform: translate(50px, 20px); } }

        /* 確保內容高度足夠撐開下潛感 */
        .scroll-wrapper { position: relative; width: 100%; height: 12000px; }
        .depth-gauge { position: fixed; right: 50px; top: 50%; transform: translateY(-50%); z-index: 1001; text-align: right; }

        #result-page { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 4000; padding: 50px; overflow-y: auto; text-align: center; 
        }
        .result-card { 
            background: linear-gradient(135deg, #0f172a, #1e3a8a); padding: 50px; 
            border-radius: 40px; max-width: 600px; display: inline-block; border: 1px solid var(--accent); 
        }
        @keyframes drift { from { background-position: 0 0; } to { background-position: 500px 1000px; } }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <div id="ocean-bg"></div>
    <div id="particles"></div>
    <div class="submersible-window"></div>

    <div class="depth-gauge">
        <h1 class="display-2 fw-bold mb-0 text-info"><span id="meters">0</span>M</h1>
        <p class="h5 opacity-50" id="zone-label">SUNLIGHT ZONE</p>
    </div>

    <div id="quiz-modal" class="dilemma-overlay">
        <div class="quiz-card">
            <h6 id="quiz-step" class="text-info mb-2 small tracking-widest">ACTUAL SITUATION</h6>
            <h2 id="quiz-title" class="mb-4 fw-bold"></h2>
            <p id="quiz-text" class="lead mb-5 opacity-75"></p>
            <div id="choices-container"></div>
        </div>
    </div>

    <div class="scroll-wrapper" id="main-content">
        <section style="height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">
            <h1 class="display-1 fw-bold mb-4">Dive into Dilemma</h1>
            <p class="lead opacity-50">點擊畫面開啟聲音，往下捲動下潛</p>
        </section>
        </div>

    <div id="result-page">
        <div class="result-card shadow-lg">
            <h5 class="opacity-50 mb-3 tracking-widest">FINAL PROFILE</h5>
            <h1 id="personality-name" class="display-4 fw-bold mb-4 text-info">分析中...</h1>
            <p id="personality-desc" class="lead mb-5 px-3"></p>
            <div class="p-4 bg-white text-dark rounded-4 text-start mb-4">
                <h6 class="fw-bold mb-2">📍 Takeaway 行動指南</h6>
                <p id="takeaway-text" class="small mb-0"></p>
            </div>
            <button class="btn btn-outline-light rounded-pill px-5 py-3 fw-bold" onclick="location.reload()">重新探索</button>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 1200 });

        // 音樂播放邏輯 (保留你成功的版本)
        document.body.onclick = () => document.getElementById('bg-music').play();

        // 1. 動態生成豐富生態系 (40 隻魚)
        const main = document.getElementById('main-content');
        function initEco() {
            const species = ['🐟', '🐠', '🐡', '🐙', '🐢', '🦐', '🐬', '🐳', '🦀', '🦈'];
            for(let i=0; i<40; i++) {
                const el = document.createElement('div');
                el.className = 'ocean-life swimming';
                el.innerText = species[Math.floor(Math.random() * species.length)];
                el.style.top = (Math.random() * 10000 + 1000) + 'px';
                el.style.left = Math.random() * 80 + 5 + '%';
                el.style.opacity = Math.random() * 0.7 + 0.3;
                main.appendChild(el);
            }
        }
        initEco();

        // 2. 題目資料庫 (5 題)
        const quizData = {
            500: { title: "離岸風電噪音 (SDG 13)", text: "施工噪音會震碎白海豚聽覺，但風場能大幅減碳。支持立即施工嗎？", c: ["支持：追求能源轉型", "反對：優先守護生物多樣性"] },
            1500: { title: "幽靈漁網代價 (SDG 14)", text: "海中積累大量漁網。清理需消耗高碳燃料。你會出動清理船嗎？", c: ["行動：立即清除海洋殺手", "維持：優先維持低碳排現狀"] },
            3000: { title: "責任消費抉擇 (SDG 12)", text: "超市裡有永續標章海鮮 vs. 便宜來源不明的海鮮。你會買？", c: ["永續：堅持選購認證產品", "現實：優先考慮家庭開支"] },
            5000: { title: "深海採礦爭議", text: "電動車需要深海金屬，但採礦會毀滅深海棲地。支持許可嗎？", c: ["支持：加速電動化減碳", "禁止：保護人類最後荒野"] },
            7500: { title: "塑膠微粒災難", text: "全面禁塑會造成生活巨變。你支持立即推動強硬禁令嗎？", c: ["立即：推動全民減塑生活", "穩健：維持穩定緩慢轉型"] }
        };

        let score = 0;
        let triggered = [];

        window.addEventListener('scroll', () => {
            let scrollY = window.scrollY;
            let depth = Math.floor(scrollY / 15); // 調整下潛比例
            document.getElementById('meters').innerText = depth;
            document.getElementById('ocean-bg').style.backgroundPosition = `0 -${scrollY}px`;

            // 深度標籤更新
            const label = document.getElementById('zone-label');
            if (depth < 200) label.innerText = "SUNLIGHT ZONE";
            else if (depth < 800) label.innerText = "TWILIGHT ZONE";
            else label.innerText = "MIDNIGHT ZONE";

            // 檢查觸發題目
            Object.keys(quizData).forEach(d => {
                if (depth >= d && !triggered.includes(d)) showQuiz(d);
            });

            // 結算條件：潛到 900M 以上 (13500px 左右) 且答完題
            if (scrollY >= 14000 && triggered.length >= 5) showResults();
        });

        function showQuiz(d) {
            triggered.push(d);
            const data = quizData[d];
            document.getElementById('quiz-title').innerText = data.title;
            document.getElementById('quiz-text').innerText = data.text;
            
            const container = document.getElementById('choices-container');
            container.innerHTML = '';
            data.c.forEach((txt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerText = txt;
                btn.onclick = () => {
                    if (idx === 0) { 
                        score -= 10;
                        document.body.classList.add('shake-effect');
                        document.getElementById('particles').classList.add('active-pollution');
                        document.getElementById('ocean-bg').style.filter = "hue-rotate(90deg) brightness(40%) blur(10px)";
                        document.querySelectorAll('.ocean-life').forEach(o => o.style.opacity = "0");
                        setTimeout(() => document.body.classList.remove('shake-effect'), 500);
                    } else { 
                        score += 10; 
                    }
                    document.getElementById('quiz-modal').style.display = 'none';
                    document.body.style.overflow = 'auto';

                    // 如果是最後一題，額外延遲後自動跳出結果
                    if (triggered.length === 5) {
                        setTimeout(showResults, 2000);
                    }
                };
                container.appendChild(btn);
            });
            document.getElementById('quiz-modal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function showResults() {
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('result-page').style.display = 'block';
            window.scrollTo(0, 0);

            let n, d, t;
            if (score > 0) {
                n = "感性生態守護者"; 
                d = "你堅信生命的價值高於商業利益。面對發展，你寧願慢下腳步，也決不讓任何生命成為進步的祭品。";
                t = "落實 SDG 14：選擇 MSC 永續認證海鮮，減少塑膠使用，給予海洋修復的空間。";
            } else {
                n = "冷靜減碳家"; 
                d = "你擁有強大的理性思維。明白對抗氣候災難(SDG 13)需要艱難的權衡，並願意為此承擔代價。";
                t = "落實 SDG 13：支持能源轉型政策，參與低碳生活推廣。你的決斷是轉型的關鍵。";
            }
            document.getElementById('personality-name').innerText = n;
            document.getElementById('personality-desc').innerText = d;
            document.getElementById('takeaway-text').innerText = t;
        }
    </script>
</body>
</html>
