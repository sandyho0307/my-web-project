<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Roboto', sans-serif; padding: 20px; }
  .container { width: 496px; border: 1px solid #ccc; padding: 10px; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .preview-label { font-size: 13px; color: #707070; }

  .info-btn {
    height: 22px;
    border-radius: 8px;
    background-color: #ffffff;
    border: 1px solid #2f2f2f;
    font-size: 13px;
    color: #2f2f2f;
    cursor: pointer;
    padding: 0 10px;
    line-height: 20px;
  }

  /* 圖片顯示區域 */
  .image-area { width: 450px; height: 240px; border: 1px solid #ddd; }
  .image-area img { width: 100%; height: 100%; object-fit: cover; }

  /* 資訊展開區塊 */
  #info-details {
    display: none;
    margin-top: 10px;
    padding: 10px;
    border-top: 1px solid #ccc;
    max-height: 150px;
    overflow-y: auto;
    background-color: #fffaf0;
  }
  .info-text { font-size: 13px; color: #2f2f2f; line-height: 1.5; }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <span class="preview-label">預覽</span>
        <button class="info-btn" onclick="toggleInfo()" id="toggleBtn">查看資訊</button>
    </div>

    <div class="image-area">
        <img src="pexels-alexbph-18207630.jpg" alt="Moonlight Ocean">
    </div>

    <div id="info-details">
        <div class="info-text">
            修改日期: 2026/04/27<br>
            類別: JPG<br>
            大小: 1.31 MB<br>
            路徑: <a href="https://www.pexels.com/zh-tw/photo/18207630/" target="_blank">Pexels Original Link</a>
        </div>
    </div>
</div>

<script>
function toggleInfo() {
  const details = document.getElementById("info-details");
  const btn = document.getElementById("toggleBtn");
  if (details.style.display === "none" || details.style.display === "") {
    details.style.display = "block";
    btn.textContent = "收起資訊";
  } else {
    details.style.display = "none";
    btn.textContent = "查看資訊";
  }
}
</script>
</body>
</html>
</html>
