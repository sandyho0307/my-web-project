<!DOCTYPE html>
<html>
<head>
<style>
/* 共同樣式：設定寬度、字體大小、置左 */
p {
  width: 450px;         /* 調整寬度比例 */
  margin: 25px 0;      /* 置左：左右不設定 auto */
  font-size: 38px;     /* 字體放大 */
  font-weight: bold;   
  text-align: center;  /* 文字在框內置中 */
  padding: 15px;       /* 增加內距，讓底色更明顯 */
}

/* 第一個：紅框藍底 (藍色填滿雙線中間) */
p.double {
  background-color: lightblue;
  /* border 設為 10px，double 會自動分配內外線與中間空隙 */
  /* 在大多數瀏覽器中，這 10px 的中間會自動填入 background-color */
  border: 10px double tomato; 
}
  
/* 第二個：黃底、藍色圓邊框 */
p.round {
  background-color: yellow;
  border: 5px solid dodgerblue; 
  border-radius: 50px; /* 膠囊狀圓角 */
}
  
/* 第三個：綠底、灰色點點框 */
p.dot {
  background-color: mediumseagreen;
  border: 8px dotted gray; 
}
</style>
</head>
<body>

<p class="double">Hello World</p>
<p class="round">Hello World</p>
<p class="dot">Hello World</p>

</body>
</html>
