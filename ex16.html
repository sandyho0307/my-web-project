<!DOCTYPE html>
<html>
<head>
<style>
/* 共同樣式 */
p {
  /* 關鍵：強制包含邊框計算，確保三個長度絕對一致 */
  box-sizing: border-box; 
  width: 500px;         
  margin: 40px 20px;    
  /* 字跟左框再近一點 (padding-left 縮小)，上下維持距離 */
  padding: 5px 2px;     
  line-height: 1.2;     
  font-size: 32px;      /* 字體調小一點 */
  font-weight: bold;
  text-align: left;     
}

/* 第一個：內粗外細紅框、藍底 */
p.double {
  background-color: lightblue;
  border: 5px solid tomato;    /* 內層粗線 */
  outline: 2px solid tomato;   /* 外層細線 */
  /* 縫隙透出底色藍色 */
  outline-offset: 3px;         
  /* 補償 outline 位移，確保左邊對齊線一致 */
  margin-left: 25px;           
}

/* 第二個：黃底藍圓邊 */
p.round {
  background-color: yellow;
  border: ２px solid dodgerblue;
  border-radius: 15px; 
  /* 為了對齊第一個有 outline 的視覺位置 */
  margin-left: 25px;
}

/* 第三個：綠底灰點點 (點點大) */
p.dot {
  background-color: mediumseagreen;
  /* 12px 粗邊框產生大點點 */
  border: 12px dotted gray;
  /* 為了對齊第一個有 outline 的視覺位置 */
  margin-left: 25px;
}
</style>
</head>
<body>

<p class="double">Hello World</p>
<p class="round">Hello World</p>
<p class="dot">Hello World</p>

</body>
</html>
