<!DOCTYPE html>
<html>
<head>
<style>
/* 共同樣式 */
p {
  width: 450px;
  margin: 20px 10px;
  /* 關鍵：縮小內距，讓文字貼近邊框 */
  padding: 2px 8px;    /* 上下只有 2px，左右 8px 稍微留一點點呼吸空間 */
  font-size: 42px;     /* 字體再放大一點，視覺上會顯得框更擠 */
  font-weight: bold;
  text-align: left;    
}

/* 第一個：內粗外細紅框、藍底 (緊湊版) */
p.double {
  background-color: lightblue;
  /* 內層粗線 */
  border: 4px solid tomato; 
  /* 外層細線 */
  outline: 2px solid tomato;
  /* 縮短兩條紅線之間的間距，讓它更精緻 */
  outline-offset: 2px; 
  /* 補償 outline 不佔空間的特性 */
  margin-top: 30px;
}

/* 第二個：黃底藍圓邊 (緊湊版) */
p.round {
  background-color: yellow;
  border: 3px solid dodgerblue;
  border-radius: 12px; /* 稍微減小圓角，讓它跟文字更貼合 */
}

/* 第三個：綠底灰點點 (緊湊版) */
p.dot {
  background-color: mediumseagreen;
  border: 8px dotted gray;
}
</style>
</head>
<body>

<p class="double">Hello World</p>
<p class="round">Hello World</p>
<p class="dot">Hello World</p>

</body>
</html>
