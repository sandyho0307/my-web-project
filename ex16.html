<!DOCTYPE html>
<html>
<head>
<style>
/* 共同樣式 */
p {
  width: 550px;         /* 統一加長三個長方形的長度 */
  margin: 30px 20px;    /* 增加邊距避免 outline 被切掉 */
  /* 極致靠近：padding 歸零，靠 line-height 壓低高度 */
  padding: 0px 5px;     
  line-height: 1;       /* 讓字框與字體幾乎重合 */
  font-size: 45px;      
  font-weight: bold;
  text-align: left;     
}

/* 第一個：內粗外細紅框、藍底 */
p.double {
  background-color: lightblue;
  border: 5px solid tomato;    /* 內層粗線 */
  outline: 2px solid tomato;   /* 外層細線 */
  /* 兩條紅線之間的縫隙會自動透出底下的 lightblue */
  outline-offset: 3px;         
  margin-top: 40px;            /* 補償 outline 空間 */
}

/* 第二個：黃底藍圓邊 (長度已與其他一致) */
p.round {
  background-color: yellow;
  border: 4px solid dodgerblue;
  border-radius: 12px; 
}

/* 第三個：綠底灰點點 (點點加大) */
p.dot {
  background-color: mediumseagreen;
  /* 增加 border 寬度會讓 dotted 的點點變大 */
  border: 12px dotted gray;
}
</style>
</head>
<body>

<p class="double">Hello World</p>
<p class="round">Hello World</p>
<p class="dot">Hello World</p>

</body>
</html>
