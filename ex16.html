<!DOCTYPE html>
<html>
<head>
<style>
/* 共同樣式：設定寬度、字體大小、置左 */
p {
  width: 600px;         /* 縮小畫布寬度 */
  margin: 5px 0;      /* 上下間隔 20px，左右為 0 即可置左 */
  padding: 10px;       /* 增加內距，讓字大一點時不會太擠 */
  font-size: 32px;     /* 字體放大（可視需求調整大小） */
  font-weight: bold;   /* 粗體 */
  /* 不設定 font-family，就會維持妳原本程式碼的預設字體 */
}

/* 第一個：內粗外細、紅框藍底 */
p.double {
  background-color: lightblue;
  /* 用 border 當作裡面那條「粗線」 */
  border: 4px solid tomato; 
  /* 用 outline 當作外面那條「細線」 */
  outline: 2px solid tomato;
  /* 為了不讓外線貼到邊界，稍微給一點外距 */
  margin-left: 5px; 
}
  
/* 第二個：黃底、藍色圓邊框 */
p.round {
  background-color: yellow;
  border: 4px solid dodgerblue; 
  border-radius: 20px; 
}
  
/* 第三個：綠底、灰色點點框 */
p.dot {
  background-color: mediumseagreen;
  border: 8px dotted gray; 
}
</style>
</head>
<body>

<p class="double">Hello World</p>
<p class="round">Hello World</p>
<p class="dot">Hello World</p>

</body>
</html>
