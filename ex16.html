<!DOCTYPE html>
<html>
<head>
<style>
/* 共同樣式 */
p {
  width: 550px;         /* 三個長方形長度加長 */
  margin: 30px 15px;    /* 置左並拉開間距 */
  /* 極致靠近：padding 設為 0，並用 line-height 控制高度（寬度縮短感） */
  padding: 0px 5px;     
  line-height: 1.1;     /* 縮短長方形的垂直寬度 */
  font-size: 45px;      
  font-weight: bold;
  text-align: left;    
}

/* 第一個：內粗外細紅框、藍底 */
p.double {
  background-color: lightblue;
  border: 5px solid tomato;    /* 內層粗線 */
  outline: 2px solid tomato;   /* 外層細線 */
  outline-offset: 3px;         /* 這裡的縫隙會透出底下的 lightblue */
  /* 因為有 outline，增加外距避免重疊 */
  margin-top: 40px;
  margin-left: 20px; 
}

/* 第二個：黃底藍圓邊，比其他兩個短 */
p.round {
  width: 400px;                /* 特別縮短長度 */
  background-color: yellow;
  border: 4px solid dodgerblue;
  border-radius: 15px; 
}

/* 第三個：綠底灰點點 */
p.dot {
  background-color: mediumseagreen;
  border: 6px dotted gray;
}
</style>
</head>
<body>

<p class="double">Hello World</p>
<p class="round">Hello World</p>
<p class="dot">Hello World</p>

</body>
</html>
