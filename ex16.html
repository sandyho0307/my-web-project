<!DOCTYPE html>
<html>
<head>
<style>
/* 共同樣式：設定固定寬度、置左 */
p {
  width: 450px;       /* 縮小畫布寬度 */
  margin: 15px 0;    /* 上下留白，左右不 auto 則會自動置左 */
  padding: 10px;
  font-weight: bold;
  font-family: Arial, sans-serif;
}

/* 第一個：內粗外細、紅框藍底 */
p.double {
  background-color: lightblue;
  /* 用 border 當作裡面那條「粗線」 */
  border: 4px solid tomato; 
  /* 用 outline 當作外面那條「細線」 */
  outline: 2px solid tomato;
  /* 關鍵：用 outline-offset 讓內外線之間產生白色的間隙 */
  outline-offset: 2px;
  /* 為了不讓外線貼到邊界，稍微給一點外距 */
  margin-left: 5px; 
}
  
/* 第二個：黃底、藍色圓邊框 */
p.round {
  background-color: yellow;
  border: 2px solid dodgerblue;
  border-radius: 20px;
}
  
/* 第三個：綠底、灰色點點框 */
p.dot {
  background-color: mediumseagreen;
  border: 8px dotted gray;
}
</style>
</head>
<body>

<p class="double">Hello World</p>
<p class="round">Hello World</p>
<p class="dot">Hello World</p>

</body>
</html>
