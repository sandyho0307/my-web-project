<!DOCTYPE html>
<html>
<head>
<style>
/* 共同樣式：設定寬度、字體大小、置左 */
p {
  width: 450px;         /* 縮小畫布寬度，讓比例更好看 */
  margin: 25px 0;      /* 上下留白，左右為 0 確保置左 */
  padding: 10px 20px;  /* 上下 10px，左右 20px 讓文字離邊框有一點點距離 */
  font-size: 36px;     /* 字體放大 */
  font-weight: bold;   /* 粗體 */
  text-align: left;    /* 關鍵：文字置左 */
  /* 維持瀏覽器預設字體 */
}

/* 第一個：紅框藍底 (雙線中間會透出藍色底色) */
p.double {
  background-color: lightblue;
  /* 10px 的雙線框，中間的縫隙會自動填入背景色 lightblue */
  border: 10px double tomato; 
}
  
/* 第二個：黃底、藍色圓邊框 */
p.round {
  background-color: yellow;
  border: 5px solid dodgerblue; 
  border-radius: 50px; /* 膠囊狀圓角 */
}
  
/* 第三個：綠底、灰色點點框 */
p.dot {
  background-color: mediumseagreen;
  border: 8px dotted gray; 
}
</style>
</head>
<body>

<p class="double">Hello World</p>
<p class="round">Hello World</p>
<p class="dot">Hello World</p>

</body>
</html>
