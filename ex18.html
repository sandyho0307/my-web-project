<!DOCTYPE html>
<html>
<head>
<style>
  /* 共同設定：維持圖片中的襯線字體 (Serif) */
  body {
    font-family: "Times New Roman", Times, serif;
    padding: 20px;
  }

  /* 第一個：上方有粗線、下方有粉紅色細線的 Heading 1 */
  h1 {
    display: inline-block; /* 讓裝飾線寬度隨文字長度 */
    font-size: 48px;
    margin-bottom: 40px;
    /* 上方粗黑線，下方粉紅細線 */
    text-decoration: overline underline;
    text-decoration-color: black pink; /* 部分瀏覽器支援，若不支援改用 border */
    /* 為了精準模擬，使用 border-top 做上線 */
    border-top: 5px solid black;
    /* 用 text-decoration 做底下的粉紅細線 */
    text-decoration: underline pink;
    padding-top: 5px;
  }

  /* 第二個：斜體、帶有黃色外粗線與黑色內細線的 Heading 2 */
  h2 {
    width: 90%;             /* 設定寬度 */
    font-style: italic;     /* 斜體 */
    font-size: 32px;
    padding: 5px;
    margin-bottom: 40px;
    border: 1px solid black; /* 內層黑色細線 */
    outline: 4px solid yellow; /* 外層黃色粗線 */
  }

  /* 第三個：置右、有底線且最後一個字母有加底線的 Heading 3 */
  h3 {
    text-align: right;      /* 置右對齊 */
    font-size: 24px;
    /* 使用 text-decoration 的底線 */
    text-decoration: underline;
    text-underline-offset: 5px; /* 讓底線跟字有一點距離 */
  }
</style>
</head>
<body>

  <h1>This is heading 1</h1>

  <h2>This is heading 2</h2>

  <h3>This is heading 3</h3>

</body>
</html>
