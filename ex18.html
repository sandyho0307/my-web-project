<!DOCTYPE html>
<html>
<head>
<style>
  /* 共同樣式 */
  body {
    font-family: "Times New Roman", Times, serif;
    padding: 80px;
  }

  /* Heading 1：粉色固定，黑色下移 */
  h1 {
    font-size: 64px;
    position: relative;
    display: inline-block;
    color: black;              
    border-top: 8px solid black; 
    line-height: 1.1;
    margin: 0 0 100px 0; 
    z-index: 10;                
    /* 1. 讓黑字黑線往左移 6px，往「下」移 8px */
    left: -6px; 
    top: 8px; 
  }

  h1::after {
    content: "This is heading 1"; 
    position: absolute;
    /* 2. 關鍵：抵銷父元素的位移，讓粉色層回到原始位置 (0,0) */
    /* 因為父元素 top: 8px，所以這裡設 -8px 就能把粉色釘回原處 */
    left: 6px;   
    top: -8px;    
    color: pink;               
    border-top: 8px solid pink;  
    z-index: -1;               
    width: 100%;
    white-space: nowrap;
  }

  /* Heading 2：立體螢光框 */
  h2 {
    width: 85%;
    font-style: italic;     
    font-size: 42px;
    padding: 5px 0px 5px 8px; 
    line-height: 1.2;
    margin: 0 0 100px 0;      
    border: 1px solid black; 
    outline: 8px outset yellow; 
    box-sizing: border-box; 
  }

  /* Heading 3：與 h2 右側對齊 */
  h3 {
    width: 85%;
    text-align: right;      
    font-size: 32px;
    text-decoration: underline;
    text-underline-offset: 5px;
    margin: 0; 
  }
</style>
</head>
<body>

  <h1>This is heading 1</h1>

  <h2>This is heading 2</h2>

  <h3>This is heading 3</h3>

</body>
</html>
