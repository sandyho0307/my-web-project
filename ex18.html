<!DOCTYPE html>
<html>
<head>
<style>
  /* 共同設定 */
  body {
    font-family: "Times New Roman", Times, serif;
    padding: 80px;
  }

  /* Heading 1：黑字主體在「左上」，粉色影子在「右下」 */
  h1 {
    font-size: 64px;
    position: relative;
    display: inline-block;
    color: black;              /* 1. 主層設定為黑字 */
    border-top: 8px solid black; /* 2. 主層設定為黑線 */
    line-height: 1.2;
    margin: 0 0 100px 0; 
    z-index: 2;                /* 確保黑字在最上面 */
    /* 黑字維持在原點 (或妳可以微調 left/top) */
    left: 0px; 
    top: 0px;
  }

  h1::after {
    content: "This is heading 1"; 
    position: absolute;
    /* 3. 對調位置：粉字往「右」與「下」移，達成黑字在左上的效果 */
    left: 6px;   
    top: 6px;    
    color: pink;               /* 4. 影子設定為粉色 */
    border-top: 8px solid pink;  /* 5. 影子設定為粉線 */
    z-index: -1;               /* 確保在黑字下面 */
    width: 100%;
    white-space: nowrap;
  }

  /* Heading 2：立體螢光框 */
  h2 {
    width: 85%;
    font-style: italic;     
    font-size: 42px;
    padding: 5px 0px 5px 8px; 
    line-height: 1.2;
    margin: 0 0 100px 0;      /* 統一與 h1 同樣的間距 */
    border: 1px solid black; 
    /* 使用 outset 產生老師圖中的立體螢光感 */
    outline: 8px outset yellow; 
    box-sizing: border-box; 
  }

  /* Heading 3：與 h2 對齊 */
  h3 {
    width: 85%;
    text-align: right;      
    font-size: 32px;
    text-decoration: underline;
    text-underline-offset: 5px;
    margin: 0; 
  }
</style>
</head>
<body>

  <h1>This is heading 1</h1>

  <h2>This is heading 2</h2>

  <h3>This is heading 3</h3>

</body>
</html>
