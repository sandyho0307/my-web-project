<!DOCTYPE html>
<html>
<head>
<style>
  /* 共同設定 */
  body {
    font-family: "Times New Roman", Times, serif;
    padding: 80px;
  }

  h1::after {
    content: "This is heading 1"; 
    position: absolute;
    /* 黑字相對位置：維持原位(或稍微偏左上)，達成粉字往下的視覺差 */
    left: -4px;   
    top: -12px;    
    color: black;
    z-index: -1; 
    /* 3. 加粗黑線 */
    border-top: 8px solid black; 
    width: 100%;
    white-space: nowrap;
  }

  /* Heading 1：粉線粉字往下移，線條加粗 */
  h1 {
    font-size: 64px;
    position: relative;
    display: inline-block;
    color: pink;
    /* 1. 加粗粉線 */
    border-top: 8px solid pink; 
    line-height: 1.2;
    /* 2. 透過 top 讓粉字和粉線整體往下移動 */
    top: 5px; 
    margin: 0 0 100px 0; 
    z-index: 2;
  }

  /* Heading 2：立體螢光框使用 outset 效果 */
  h2 {
    width: 85%;
    font-style: italic;     
    font-size: 42px;
    padding: 5px 0px 5px 8px; /* 增加左右 padding 確保 g 不重疊 */
    line-height: 1.2;
    margin: 0 0 80px 0; 
    /* 4. 黑色內框 */
    border: 1px solid black; 
    /* 5. 螢光部分使用 outset 達成老師圖中那種「右下有深色邊」的立體感 */
    outline: 8px outset yellow; 
    box-sizing: border-box; 
    /* 清除之前的 shadow 改用純粹的 border 特效 */
    box-shadow: none;
  }

  /* Heading 3：與 h2 右側對齊 */
  h3 {
    width: 85%;
    text-align: right;      
    font-size: 32px;
    text-decoration: underline;
    text-underline-offset: 5px;
    margin: 0; 
  }
</style>
</head>
<body>

  <h1>This is heading 1</h1>

  <h2>This is heading 2</h2>

  <h3>This is heading 3</h3>

</body>
</html>
