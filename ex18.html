<!DOCTYPE html>
<html>
<head>
<style>
  /* 共同設定 */
  body {
    font-family: "Times New Roman", Times, serif;
    padding: 40px;
  }

  /* Heading 1: 黑字在上/左、粉字在下/右，且上方皆有線 */
  h1 {
    font-size: 48px;
    position: relative;
    display: inline-block;
    margin-bottom: 60px;
    color: black;
    /* 黑字上方的黑線 */
    border-top: 2px solid black;
    line-height: 1.2;
  }

  /* 利用偽元素製作底層的粉色字與粉色線 */
  h1::after {
    content: "This is heading 1"; /* 複製同樣的文字 */
    position: absolute;
    left: 4px;   /* 向右偏移，讓黑字顯得在左邊 */
    top: 4px;    /* 向下偏移，讓黑字顯得在上面 */
    color: pink;
    z-index: -1; /* 放在黑字後方 */
    /* 粉字上方的粉線 */
    border-top: 2px solid pink;
    width: 100%;
    white-space: nowrap;
  }

  /* Heading 2: 長方形縮短 */
  h2 {
    width: 70%;             /* 縮短長度 */
    font-style: italic;     
    font-size: 32px;
    padding: 10px;
    margin-bottom: 10px;    /* 縮短與 h3 的間距 */
    border: 1px solid black; 
    outline: 4px solid yellow;
    box-sizing: border-box; /* 確保寬度包含邊框 */
  }

  /* Heading 3: 與 Heading 2 的右側對齊 */
  h3 {
    width: 70%;             /* 寬度與 h2 一致 */
    text-align: right;      /* 文字置右，就會剛好對齊 h2 右邊緣 */
    font-size: 24px;
    text-decoration: underline;
    text-underline-offset: 3px;
    margin-top: 20px;       /* 增加一點跟 h2 外框的距離 */
  }
</style>
</head>
<body>

  <h1>This is heading 1</h1>

  <h2>This is heading 2</h2>

  <h3>This is heading 3</h3>

</body>
</html>
