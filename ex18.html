<!DOCTYPE html>
<html>
<head>
<style>
  /* 共同設定 */
  body {
    font-family: "Times New Roman", Times, serif;
    padding: 80px;
  }

  /* Heading 1：讓黑線/黑字往下壓，與粉色層靠近 */
  h1 {
    font-size: 64px;
    position: relative;
    display: inline-block;
    color: black;              
    border-top: 8px solid black; 
    line-height: 1.1;
    margin: 0 0 100px 0; 
    z-index: 10;                
    /* 關鍵：調整這裡的 top 數值，讓黑線往下壓 */
    left: -2px; 
    top: 3px; 
  }

  h1::after {
    content: "This is heading 1"; 
    position: absolute;
    /* 影子固定位置 */
    left: 0px;   
    top: 0px;    
    color: pink;               
    border-top: 8px solid pink;  
    z-index: -1;                 
    width: 100%;
    white-space: nowrap;
  }

  /* Heading 2：立體螢光框 */
  h2 {
    width: 85%;
    font-style: italic;     
    font-size: 42px;
    padding: 5px 0px 5px 8px; 
    line-height: 1.2;
    margin: 0 0 100px 0;      
    border: 1px solid black; 
    outline: 8px outset yellow; 
    box-sizing: border-box; 
  }

  /* Heading 3：與 h2 右側對齊 */
  h3 {
    width: 85%;
    text-align: right;      
    font-size: 32px;
    text-decoration: underline;
    text-underline-offset: 5px;
    margin: 0; 
  }
</style>
</head>
<body>

  <h1>This is heading 1</h1>

  <h2>This is heading 2</h2>

  <h3>This is heading 3</h3>

</body>
</html>
