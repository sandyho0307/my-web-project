<!DOCTYPE html>
<html>
<head>
<style>
  /* 共同設定 */
  body {
    font-family: "Times New Roman", Times, serif;
    padding: 80px;
  }

  /* Heading 1：黑字黑線在左上（原點），粉字粉線在右下（偏移） */
  h1 {
    font-size: 64px;
    position: relative;
    display: inline-block;
    color: black;              
    border-top: 8px solid black; /* 黑線在上方 */
    line-height: 1.1;
    margin: 0 0 100px 0; 
    z-index: 10;                 /* 確保黑字黑線在最頂層 */
    /* 釘死黑字在原點 */
    left: 0px; 
    top: 0px; 
  }

  h1::after {
    content: "This is heading 1"; 
    position: absolute;
    /* 關鍵位移：粉字單獨往「右」移 4px，往「下」移 0.5px */
    /* 這樣黑字就會自然呈現於粉字的「左上方」 */
    left: 4px;   
    top: 0.5px;    
    color: pink;               
    border-top: 8px solid pink;  /* 粉線在下方 */
    z-index: -1;                 /* 確保粉字粉線被黑字壓住 */
    width: 100%;
    white-space: nowrap;
  }

  /* Heading 2：立體螢光框 */
  h2 {
    width: 85%;
    font-style: italic;     
    font-size: 42px;
    padding: 5px 0px 5px 8px; 
    line-height: 1.2;
    margin: 0 0 100px 0;      
    border: 1px solid black; 
    outline: 8px outset yellow; 
    box-sizing: border-box; 
  }

  /* Heading 3：與 h2 對齊 */
  h3 {
    width: 85%;
    text-align: right;      
    font-size: 32px;
    text-decoration: underline;
    text-underline-offset: 5px;
    margin: 0; 
  }
</style>
</head>
<body>

  <h1>This is heading 1</h1>

  <h2>This is heading 2</h2>

  <h3>This is heading 3</h3>

</body>
</html>
