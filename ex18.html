<!DOCTYPE html>
<html>
<head>
<style>
  /* 共同設定 */
  body {
    font-family: "Times New Roman", Times, serif;
    padding: 60px; /* 增加邊距避免外框被切到 */
  }

  /* Heading 1: 黑粉重疊，線條加粗且更靠近 */
  h1 {
    font-size: 64px;       /* 字體再大一點 */
    position: relative;
    display: inline-block;
    margin-bottom: 80px;
    color: black;
    /* 黑字上方的黑線加粗 */
    border-top: 5px solid black;
    line-height: 1.1;
    z-index: 1;
  }

  /* 利用偽元素製作底層的粉色字與粉色線 */
  h1::after {
    content: "This is heading 1"; 
    position: absolute;
    /* 縮小偏移量，讓兩者更靠近 */
    left: 2px;   
    top: 2px;    
    color: pink;
    z-index: -1; 
    /* 粉字上方的粉線加粗 */
    border-top: 5px solid pink;
    width: 100%;
    white-space: nowrap;
  }

  /* Heading 2: 字跟長方形上下左極近 */
  h2 {
    width: 70%;             
    font-style: italic;     
    font-size: 42px;        /* 字體放大 */
    /* 縮小上下左間距 */
    padding: 0px 0px 0px 2px; 
    line-height: 1;         /* 緊縮上下高度 */
    margin-bottom: 10px;    
    border: 1px solid black; 
    outline: 5px solid yellow; /* 黃色外框也稍微加粗 */
    box-sizing: border-box; 
  }

  /* Heading 3: 維持與 h2 對齊 */
  h3 {
    width: 70%;             
    text-align: right;      
    font-size: 32px;        /* 字體放大 */
    text-decoration: underline;
    text-underline-offset: 4px;
    margin-top: 30px;       
  }
</style>
</head>
<body>

  <h1>This is heading 1</h1>

  <h2>This is heading 2</h2>

  <h3>This is heading 3</h3>

</body>
</html>
