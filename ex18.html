<!DOCTYPE html>
<html>
<head>
<style>
  /* 共同設定 */
  body {
    font-family: "Times New Roman", Times, serif;
    padding: 80px;
  }

  /* Heading 1：黑粉交錯，黑在左上、粉在右下 */
  h1 {
    font-size: 64px;
    position: relative;
    display: inline-block;
    color: black;
    border-top: 4px solid black; /* 黑線 */
    line-height: 1.2;
    margin: 0 0 80px 0; /* 下方間距固定 80px */
    z-index: 2;
  }

  h1::after {
    content: "This is heading 1"; 
    position: absolute;
    /* 調整位移：讓黑字維持在左上，粉字往右(left)與下(top)移動 */
    left: 4px;   
    top: 4px;    
    color: pink;
    z-index: -1; 
    border-top: 4px solid pink; /* 粉線 */
    width: 100%;
    white-space: nowrap;
  }

  /* Heading 2：立體螢光框 */
  h2 {
    width: 85%;
    font-style: italic;     
    font-size: 42px;
    /* 增加垂直 padding (3px)，避免文字 g 被切到 */
    padding: 3px 0px 3px 5px; 
    line-height: 1.2;
    margin: 0 0 80px 0; /* 下方間距同樣設為 80px */
    border: 1px solid black; 
    outline: 5px solid yellow; 
    /* 老師圖中的陰影更像是立體邊框效果，用 inset shadow 模擬內凹感 */
    box-shadow: 2px 2px 0px #888, inset 1px 1px 0px #000;
    box-sizing: border-box; 
  }

  /* Heading 3：與 h2 對齊 */
  h3 {
    width: 85%;
    text-align: right;      
    font-size: 32px;
    text-decoration: underline;
    text-underline-offset: 5px;
    margin: 0; /* 靠 h2 的 margin-bottom 推開距離 */
  }
</style>
</head>
<body>

  <h1>This is heading 1</h1>

  <h2>This is heading 2</h2>

  <h3>This is heading 3</h3>

</body>
</html>
