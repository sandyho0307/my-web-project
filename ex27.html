<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { padding: 20px; font-family: sans-serif; }

    /* 1. 綠色頭部 */
    .green-header { background-color: #9ccc65; height: 100px; width: 100%; margin-bottom: 20px; }

    /* 2. 中間藍色區塊：使用 Grid 確保 3 欄 */
    .blue-container { 
        display: grid;
        grid-template-columns: repeat(3, 1fr); /* 強制3欄 */
        gap: 15px; 
        margin-bottom: 20px; 
    }
    .blue-box { 
        background-color: #00bcd4; 
        height: 400px; /* 強制高瘦長方形 */
        width: 100%;
    }

    /* 3. 下方灰色區塊：使用 Grid 確保 4 欄 */
    .grey-container { 
        display: grid;
        grid-template-columns: repeat(4, 1fr); /* 強制4欄 */
        gap: 15px; 
    }
    .grey-box { background-color: #e0e0e0; height: 100px; }

    /* --- 手機版 (小於 480px) --- */
    @media screen and (max-width: 480px) {
        .blue-container { grid-template-columns: 1fr; } /* 手機變成1欄 */
        .blue-box { height: 250px; } /* 手機版的高度 */
        
        .grey-container { grid-template-columns: repeat(2, 1fr); } /* 手機變成2欄 (2x2) */
    }
</style>
</head>
<body>

    <div class="green-header"></div>

    <div class="blue-container">
        <div class="blue-box"></div>
        <div class="blue-box"></div>
        <div class="blue-box"></div>
    </div>

    <div class="grey-container">
        <div class="grey-box"></div>
        <div class="grey-box"></div>
        <div class="grey-box"></div>
        <div class="grey-box"></div>
    </div>

</body>
</html>
