<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { padding: 20px; font-family: sans-serif; }

        /* 1. 綠色頭部 */
        .green-header { background-color: #9ccc65; height: 100px; width: 100%; margin-bottom: 20px; }

        /* 2. 中間藍色區塊：電腦版 */
        .blue-container { 
            display: flex; 
            gap: 15px; 
            margin-bottom: 20px; 
        }
        .blue-box { 
            background-color: #00bcd4; 
            flex: 1; 
            height: 400px !important; /* 強制高度，確保縱邊長 */
        }

        /* 3. 下方灰色區塊 */
        .grey-container { display: flex; flex-wrap: wrap; gap: 15px; }
        .grey-box { background-color: #e0e0e0; height: 100px; flex: 0 0 calc(25% - 15px); }

        /* --- 響應式：手機版 (小於 480px) --- */
        @media screen and (max-width: 480px) {
            .blue-container { flex-direction: column !important; }
            .blue-box { 
                height: 250px !important; /* 手機版明確給予高度 */
                width: 100% !important; 
            }
            .grey-box { flex: 0 0 calc(50% - 15px) !important; }
        }
    </style>
</head>
<body>
    <div class="green-header"></div>
    <div class="blue-container">
        <div class="blue-box"></div>
        <div class="blue-box"></div>
        <div class="blue-box"></div>
    </div>
    <div class="grey-container">
        <div class="grey-box"></div>
        <div class="grey-box"></div>
        <div class="grey-box"></div>
        <div class="grey-box"></div>
    </div>
</body>
</html>
