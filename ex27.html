<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    * { box-sizing: border-box; }
    body { margin: 20px; font-family: sans-serif; }

    /* 1. 綠色頭部 */
    .green-header { background-color: #9ccc65; height: 100px; width: 100%; margin-bottom: 20px; }

    /* 2. 中間藍色區塊 (預設電腦版) */
    .blue-container { 
        display: flex; 
        gap: 15px; 
        margin-bottom: 20px; 
    }
    .blue-box { 
        background-color: #00bcd4; 
        flex: 1; 
        height: 350px; /* 【修正】強制高度，讓它變得高且長 (直邊 > 橫邊) */
    }

    /* 3. 下方灰色區塊 (預設電腦版：4欄並排) */
    .grey-container { 
        display: flex; 
        flex-wrap: wrap; 
        gap: 15px; 
    }
    .grey-box { 
        background-color: #e0e0e0; 
        height: 100px; 
        flex: 0 0 calc(25% - 12px); /* 4欄 */
    }

    /* --- 響應式：手機版 (小於 480px) --- */
    @media screen and (max-width: 480px) {
        /* 中間：垂直堆疊 */
        .blue-container { 
            flex-direction: column; 
            display: flex; /* 確保 flex 正常運作 */
        }
        .blue-box { 
            height: 200px; /* 【修正】給予明確高度，確保它不會消失 */
            width: 100%;   /* 強制填滿寬度 */
        } 

        /* 下方：2x2 格狀 */
        .grey-box { flex: 0 0 calc(50% - 8px); }
    }
</style>
</head>
<body>

    <div class="green-header"></div>

    <div class="blue-container">
        <div class="blue-box"></div>
        <div class="blue-box"></div>
        <div class="blue-box"></div>
    </div>

    <div class="grey-container">
        <div class="grey-box"></div>
        <div class="grey-box"></div>
        <div class="grey-box"></div>
        <div class="grey-box"></div>
    </div>

</body>
</html>
