<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { padding: 20px; font-family: sans-serif; }

        /* 1. 綠色頭部 */
        .green-header { background-color: #9ccc65; height: 100px; width: 100%; margin-bottom: 20px; }

        /* 2. 中間藍色區塊 (電腦版：強制高度 > 寬度) */
        .blue-container { 
            display: flex; 
            gap: 15px; 
            margin-bottom: 20px; 
        }
        .blue-box { 
            background-color: #00bcd4; 
            flex: 1; 
            height: 350px; /* 【關鍵】強制高度，讓它縱邊 > 橫邊 */
        }

        /* 3. 下方灰色區塊 (電腦版：4個並排) */
        .grey-container { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 15px; 
        }
        .grey-box { 
            background-color: #e0e0e0; 
            height: 100px; 
            flex: 1 1 calc(25% - 15px); /* 4個並排 */
        }

        /* --- 響應式：手機版 (小於 480px) --- */
        @media screen and (max-width: 480px) {
            /* 中間區塊：直向堆疊 */
            .blue-container { flex-direction: column; }
            .blue-box { 
                height: 250px; /* 給予明確高度，確保不消失 */
                width: 100%;   /* 手機版強制填滿 */
            }

            /* 下方區塊：2x2 格狀 */
            .grey-box { flex: 1 1 calc(50% - 15px); }
        }
    </style>
</head>
<body>

    <div class="green-header"></div>

    <div class="blue-container">
        <div class="blue-box"></div>
        <div class="blue-box"></div>
        <div class="blue-box"></div>
    </div>

    <div class="grey-container">
        <div class="grey-box"></div>
        <div class="grey-box"></div>
        <div class="grey-box"></div>
        <div class="grey-box"></div>
    </div>

</body>
</html>
