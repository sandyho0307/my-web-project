<!DOCTYPE html>
<html>
<head>
<style>
  * { box-sizing: border-box; } /* 確保 padding/border 不會影響寬度計算 */

  .container {
    display: flex;
    align-items: center; /* 垂直居中對齊 */
    justify-content: center;
    gap: 20px;
    padding: 20px;
  }

  /* 1. 左側：寬 33%，高 300px，圓角 18px (no distortion) */
  .rounded-img {
    width: 33%;        
    height: 300px;     
    border-radius: 18px; 
    object-fit: cover; 
    object-position: center top; 
  }

  /* 2. 中間：150px x 150px 圓形 (no distortion) */
  .circle-img {
    width: 150px;      
    height: 150px;     
    border: 5px solid #333; 
    border-radius: 50%; 
    object-fit: cover; 
  }

  /* 3. 右側：寬 33%，高 300px (distortion) */
  .distorted-img {
    width: 33%;        
    height: 300px;     
    object-fit: fill;  /* 強制填滿造成變形 */
  }
</style>
</head>
<body>

<div class="container">
  <img src="pexels-flora-hsu-32249896-7008047.jpg" alt="No Distortion" class="rounded-img">

  <img src="pexels-alexbph-18207630.jpg" alt="Circle" class="circle-img">

  <img src="pexels-flora-hsu-32249896-7008047.jpg" alt="Distortion" class="distorted-img">
</div>

</body>
</html>
