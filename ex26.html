<!DOCTYPE html>
<html>
<head>
<style>
  /* 使用 Flexbox 讓三張圖片並排 */
  .container {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 20px;
  }

  /* 1. 左側：圓角長方形 (無變形) */
  .rounded-img {
    width: 33%;        /* 寬度 33% */
    height: 300px;     /* 固定高度 */
    border-radius: 18px; 
    object-fit: cover; /* 裁切以填滿空間，保留比例 */
  }

  /* 2. 中間：圓形 (無變形) */
  .circle-img {
    width: 150px;      
    height: 150px;     
    border: 5px solid #333; 
    border-radius: 50%; 
    object-fit: cover; /* 裁切以填滿圓形 */
  }

  /* 3. 右側：變形長方形 (產生 distortion) */
  .distorted-img {
    width: 33%;        
    height: 300px;     
    object-fit: fill;  /* 強制拉伸，讓圖片變形 */
  }
</style>
</head>
<body>

<div class="container">
  <img src="pexels-flora-hsu-32249896-7008047.jpg" alt="No Distortion" class="rounded-img">

  <img src="pexels-flora-hsu-32249896-7008047.jpg" alt="Circle" class="circle-img">

  <img src="pexels-flora-hsu-32249896-7008047.jpg" alt="Distortion" class="distorted-img">
</div>

</body>
</html>
