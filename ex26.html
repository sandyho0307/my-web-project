<!DOCTYPE html>
<html>
<head>
<style>
  /* 容器：讓圖片置中對齊 */
  .container {
    display: flex;
    align-items: center; /* 讓圖片垂直置中 */
    justify-content: center; /* 水平置中 */
    gap: 30px;
    padding: 20px;
  }

  /* 左右兩側圖片的共同設定 */
  .rounded-img, .distorted-img {
    width: 300px;      /* 指定寬度 */
    height: 450px;     /* 統一高度，確保縱邊對齊 */
  }

  /* 1. 左側：圓角 (no distortion) */
  .rounded-img {
    border-radius: 18px; 
    object-fit: cover; 
    /* 關鍵：優先顯示圖片上方 (塔尖) */
    object-position: center top; 
  }

  /* 2. 中間：圓形 (no distortion) */
  .circle-img {
    width: 150px;      
    height: 150px;     
    border: 5px solid #333; 
    border-radius: 50%; 
    object-fit: cover; 
  }

  /* 3. 右側：變形長方形 (distortion) */
  .distorted-img {
    object-fit: fill;  /* 強制拉伸，產生變形效果 */
  }
</style>
</head>
<body>

<div class="container">
  <img src="pexels-flora-hsu-32249896-7008047.jpg" alt="No Distortion" class="rounded-img">

  <img src="pexels-alexbph-18207630.jpg" alt="Circle" class="circle-img">

  <img src="pexels-flora-hsu-32249896-7008047.jpg" alt="Distortion" class="distorted-img">
</div>

</body>
</html>
