<!DOCTYPE html>
<html>
<head>
<style>
  /* 使用 Flexbox 讓三張圖片並排 */
  .container {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 20px;
  }

  /* 1. 左側：圓角長方形 (no distortion) */
  .rounded-img {
    width: 33%;        /* 要求寬度 33% */
    height: 300px;     /* 固定高度 */
    border-radius: 18px; /* 要求圓角 18px */
    object-fit: cover; /* 關鍵：這會裁切圖片以填滿空間，不會變形 */
  }

  /* 2. 中間：圓形 (no distortion) */
  .circle-img {
    width: 150px;      /* 要求寬度 150px */
    height: 150px;     /* 要求高度 150px */
    border: 5px solid #333; /* 要求有邊框 */
    border-radius: 50%; /* 關鍵：50% 圓角會變成圓形 */
    object-fit: cover; /* 關鍵：這會裁切圖片以填滿圓形，避免變形 */
  }

  /* 3. 右側：變形長方形 (distortion) */
  .distorted-img {
    width: 33%;        /* 要求寬度 33% */
    height: 300px;     /* 固定高度 */
    object-fit: fill;  /* 關鍵：強迫圖片填滿容器，如果比例不合就會產生「變形」 */
  }
</style>
</head>
<body>

<h2>Image Styling Practice</h2>

<div class="container">
  <img src="pexels-alexbph-18207630.jpg" alt="No Distortion" class="rounded-img">

  <img src="pexels-alexbph-18207630.jpg" alt="Circle" class="circle-img">

  <img src="pexels-alexbph-18207630.jpg" alt="Distortion" class="distorted-img">
</div>

</body>
</html>
