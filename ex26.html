<!DOCTYPE html>
<html>
<head>
<style>
  /* 容器：讓圖片置中對齊，並確保垂直頂端對齊 */
  .container {
    display: flex;
    align-items: flex-start; 
    justify-content: center;
    gap: 30px;
    padding: 20px;
  }

  /* 1. 左側：直式圓角長方形 (no distortion) */
  .rounded-img {
    width: 300px;      
    height: 450px;     
    border-radius: 18px; 
    object-fit: cover; /* 裁切以填滿，保留比例 */
    object-position: center top; /* 確保鐵塔頂端不被切掉 */
  }

  /* 2. 中間：圓形 (no distortion) */
  .circle-img {
    width: 150px;      
    height: 150px;     
    border: 5px solid #333; 
    border-radius: 50%; 
    object-fit: cover; 
  }

  /* 3. 右側：極端變形長方形 (distortion) */
  .distorted-img {
    width: 100px;      /* 縮小寬度，強制產生劇烈變形 */
    height: 450px;     /* 高度維持 450px，確保與左側對齊 */
    object-fit: fill;  /* 強制填滿容器，導致嚴重變形 */
  }
</style>
</head>
<body>

<div class="container">
  <img src="pexels-flora-hsu-32249896-7008047.jpg" alt="No Distortion" class="rounded-img">

  <img src="pexels-alexbph-18207630.jpg" alt="Circle" class="circle-img">

  <img src="pexels-flora-hsu-32249896-7008047.jpg" alt="Distortion" class="distorted-img">
</div>

</body>
</html>
